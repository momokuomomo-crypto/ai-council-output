<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ウリ専ハウスへようこそ 第1話</title>
<style>
  :root{ --ink:#6b5a50; --paper:#faf6ee; --panel:#fffefb; }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:#ece4d4; color:#5a4a42;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Zen Maru Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .book{ max-width:820px; margin:0 auto; padding:24px 14px 80px; }
  .cover{
    background:var(--panel); border:1.8px solid var(--ink); border-radius:8px;
    padding:34px 24px 26px; text-align:center; margin-bottom:28px;
    box-shadow:0 6px 18px rgba(107,90,80,.18);
  }
  .cover h1{ font-size:33px; margin:0 0 6px; letter-spacing:.06em; font-weight:600; }
  .cover .ep{ font-size:19px; font-weight:600; margin:8px 0 2px; }
  .cover .sub{ font-size:13px; color:#a8917c; }
  .cast{ display:flex; justify-content:center; align-items:flex-end; gap:2px; margin:14px 0 6px; }
  .cast div{ width:136px; }
  .cast svg{ width:100%; display:block; }
  .page{
    background:var(--paper); border:1.8px solid var(--ink); border-radius:8px;
    padding:12px; margin:0 auto 26px; box-shadow:0 6px 18px rgba(107,90,80,.18);
    position:relative;
  }
  .pagenum{
    position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    font-size:12px; color:#c2ac92; font-weight:600;
  }
  .row{ display:flex; flex-direction:row-reverse; gap:10px; margin-bottom:10px; }
  .row:last-child{ margin-bottom:14px; }
  .panel{
    position:relative; background:var(--panel); border:1.8px solid var(--ink);
    border-radius:4px; overflow:hidden; flex:1 1 0;
  }
  .stage{ position:absolute; inset:0; }
  .scene{ position:absolute; inset:0; width:100%; height:100%; }
  .ch{ position:absolute; z-index:2; }
  .ch svg{ display:block; width:100%; height:auto; overflow:visible; }
  .bub{
    position:absolute; background:#fff; border:1.6px solid var(--ink);
    border-radius:16px; padding:7px 11px; text-align:center;
    font-weight:600; line-height:1.38; font-size:13px; letter-spacing:.01em;
    z-index:5; white-space:nowrap; color:#5a4a42;
  }
  .bub small{ font-size:11px; }
  .bub.think{ border-style:dotted; border-width:2px; border-radius:24px; background:#fffdf6; }
  .bub.shout{
    border-radius:8px; background:#fff; color:#c4574a; border-color:#c4574a;
    border-width:1.8px; padding:9px 12px; font-weight:700;
  }
  .naru{
    position:absolute; background:#fffdf6; border:1.6px solid var(--ink);
    border-radius:2px; padding:6px 10px; font-size:12px; font-weight:600;
    white-space:nowrap; line-height:1.38; z-index:5; color:#5a4a42;
  }
  .sfx{
    position:absolute; font-weight:800; color:#a8917c;
    font-size:24px; letter-spacing:.02em;
    transform:rotate(-6deg); pointer-events:none; z-index:4;
  }
  .name{ position:absolute; font-size:10px; font-weight:700; color:#a8917c;
    background:rgba(255,255,255,.9); padding:1px 6px; border-radius:8px; z-index:5;
    border:1px solid rgba(107,90,80,.35); }
  .endcard{ text-align:center; color:#a8917c; padding:10px 0 0; font-weight:600; }
  .note{ background:var(--panel); border:1.6px dashed var(--ink); border-radius:8px;
    padding:16px 18px; font-size:13px; line-height:1.7; }
  .note h3{ margin:0 0 8px; }
</style>
</head>
<body>
<div class="book" id="book"></div>

<script>
/* ========= 作画エンジン：細線・水彩風・リング瞳スタイル ========= */
let uid=0;
const LN='#6b5a50';        /* 繊細なセピアの主線 */
const LNW=1.6;             /* 基本線幅（細い） */
const sr=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};

const CH={
  ren: { skin:'#fdeee0', hair:'#3d3733', hairLo:'#57504a', cloth:'#37332f', cloth2:'#4a4540',
         irisA:'#a8bfa0', irisB:'#7a9472' },
  dai: { skin:'#f8e2c8', hair:'#a8845c', hairLo:'#8a6a48', cloth:'#a9b298', cloth2:'#97a087' },
  gon: { skin:'#eec49c', hair:'#453a30', hairLo:'#5c4e40', cloth:'#f4efe2', cloth2:'#e4dcc8' },
  piyo:{ skin:'#fff2e8', hair:'#dcbd90', hairLo:'#c4a172', cloth:'#f7ecd8', cloth2:'#f0b8c4',
         irisA:'#e8899a', irisB:'#a04a5c', irisC:'#f5b8c4' }
};

const EXPR={
  normal:{e:'open',m:'closed'},
  deadpan:{e:'half',m:'closed'},
  smug:{e:'half',m:'smirk'},
  soft:{e:'closedHappy',m:'smile'},
  happy:{e:'closedHappy',m:'open'},
  grin:{e:'open',m:'grin'},
  dead:{e:'flat',m:'wavy'},
  cry:{e:'closedSad',m:'wavy',tear:1},
  shock:{e:'shrink',m:'oo',sweat:1},
  yell:{e:'angry',m:'shout'},
  blank:{e:'hollow',m:'oo'},
  x:{e:'xx',m:'wavy',sweat:1}
};

/* ---- ぴよのリング瞳（signature） ---- */
function ringEye(c,cx,cy,kind){
  const hl = kind!=='hollow';
  const shrink = kind==='shrink';
  const rx = shrink?5.2:7.6, ry = shrink?7:10.5;
  let s='';
  // 白目
  s+=`<path d="M${cx-8.6} ${cy-10} Q${cx} ${cy-13.5} ${cx+8.6} ${cy-10} L${cx+9} ${cy+7.5} Q${cx} ${cy+11.5} ${cx-9} ${cy+7.5} Z" fill="#fff"/>`;
  // 虹彩：外リム→ベース→内リング→下弦の光→瞳孔
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${c.irisA}" stroke="${c.irisB}" stroke-width="1.6"/>`;
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx*0.62}" ry="${ry*0.66}" fill="none" stroke="${c.irisC}" stroke-width="1.3" opacity=".9"/>`;
  s+=`<path d="M${cx-rx*0.7} ${cy+ry*0.4} Q${cx} ${cy+ry*0.95} ${cx+rx*0.7} ${cy+ry*0.4} Q${cx} ${cy+ry*0.55} ${cx-rx*0.7} ${cy+ry*0.4} Z" fill="${c.irisC}" opacity=".8"/>`;
  s+=`<ellipse cx="${cx}" cy="${cy+0.5}" rx="${shrink?1.4:2.1}" ry="${shrink?2:3}" fill="#43272c"/>`;
  if(hl){
    s+=`<circle cx="${cx-2.8}" cy="${cy-3.8}" r="2.5" fill="#fff"/>
        <circle cx="${cx+3.4}" cy="${cy+3.2}" r="1.2" fill="#fff" opacity=".95"/>
        <path d="M${cx+1.5} ${cy-6.5} A6 6 0 0 1 ${cx+5} ${cy-2.5}" fill="none" stroke="#fff" stroke-width="1.1" opacity=".9"/>`;
  }
  // 上まつげ（細いが密度あり）
  s+=`<path d="M${cx-9.4} ${cy-9} Q${cx} ${cy-14} ${cx+9.4} ${cy-9}" fill="none" stroke="${LN}" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M${cx+9} ${cy-9.6} l3 -2.6 M${cx+7} ${cy-11.4} l2.2 -2.6" stroke="${LN}" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M${cx-9} ${cy-9.6} l-2.6 -2.2" stroke="${LN}" stroke-width="1.3" stroke-linecap="round"/>`;
  // 下ライン
  s+=`<path d="M${cx-6.5} ${cy+10.5} Q${cx} ${cy+12.5} ${cx+6.5} ${cy+10.5}" fill="none" stroke="${LN}" stroke-width="1" opacity=".5"/>`;
  return s;
}

/* ---- 目：全キャラ ---- */
function eyes(who,kind,cy){
  const c=CH[who];
  const dx = who==='gon'?22:who==='piyo'?17:16;
  const L=100-dx, R=100+dx;
  const one=(cx,sgn)=>{
    /* 閉じ目・記号系は共通 */
    if(kind==='closedHappy') return `<path d="M${cx-7} ${cy+1} Q${cx} ${cy-6.5} ${cx+7} ${cy+1}" stroke="${LN}" stroke-width="2" fill="none" stroke-linecap="round"/>${who==='piyo'?`<path d="M${cx+sgn*6.5} ${cy-2} l${sgn*2.4} -2" stroke="${LN}" stroke-width="1.2" stroke-linecap="round"/>`:''}`;
    if(kind==='closedSad') return `<path d="M${cx-7} ${cy-1} Q${cx} ${cy+5.5} ${cx+7} ${cy-1}" stroke="${LN}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    if(kind==='flat') return `<path d="M${cx-6.5} ${cy} L${cx+6.5} ${cy}" stroke="${LN}" stroke-width="1.9" stroke-linecap="round"/>`;
    if(kind==='xx') return `<path d="M${cx-5} ${cy-4.5} L${cx+5} ${cy+4.5} M${cx+5} ${cy-4.5} L${cx-5} ${cy+4.5}" stroke="${LN}" stroke-width="2" stroke-linecap="round"/>`;

    if(who==='piyo') return ringEye(c,cx,cy,kind==='shrink'?'shrink':kind==='hollow'?'hollow':'open');

    if(who==='ren'){
      /* 山田さん系：切れ長・気だるい半眼 */
      const half = (kind==='half');
      const lidY = half? cy-2.5 : cy-5;
      let s='';
      s+=`<path d="M${cx-8} ${cy+4.5} Q${cx} ${cy+6.5} ${cx+8} ${cy+4.5} L${cx+8} ${lidY+2} L${cx-8} ${lidY+2} Z" fill="#fff"/>`;
      s+=`<ellipse cx="${cx}" cy="${cy+1}" rx="4.6" ry="${half?4:5.5}" fill="${c.irisA}" stroke="${c.irisB}" stroke-width="1.2"/>
          <ellipse cx="${cx}" cy="${cy+1.5}" rx="1.5" ry="2" fill="#332e28"/>
          <circle cx="${cx-1.6}" cy="${cy-0.8}" r="1" fill="#fff"/>`;
      s+=`<path d="M${cx-8.5} ${lidY+2} L${cx+8.5} ${lidY+2} Z" fill="none"/>
          <rect x="${cx-9}" y="${lidY-6}" width="18" height="${8}" fill="${c.skin}"/>
          <path d="M${cx-8.5} ${lidY+2} Q${cx} ${lidY-0.5} ${cx+8.5} ${lidY+1}" fill="none" stroke="${LN}" stroke-width="2.1" stroke-linecap="round"/>
          <path d="M${cx+8} ${lidY+0.5} l3 -1.6" stroke="${LN}" stroke-width="1.3" stroke-linecap="round"/>`;
      s+=`<path d="M${cx-6} ${cy+6} Q${cx} ${cy+7.5} ${cx+6} ${cy+6}" fill="none" stroke="${LN}" stroke-width=".9" opacity=".45"/>`;
      if(kind==='shrink') s=s.replace(/rx="4.6"/,'rx="3"').replace(/ry="5.5"/,'ry="3.6"');
      if(kind==='angry') s+=`<path d="M${cx-sgn*8} ${cy-9} L${cx+sgn*8} ${cy-5.5}" stroke="${LN}" stroke-width="1.8" stroke-linecap="round"/>`;
      return s;
    }
    if(who==='dai'){
      if(kind==='shrink'||kind==='hollow') return `<circle cx="${cx}" cy="${cy}" r="4.6" fill="#fff" stroke="${LN}" stroke-width="1.6"/><circle cx="${cx}" cy="${cy}" r="1.4" fill="${LN}"/>`;
      if(kind==='angry') return `<circle cx="${cx}" cy="${cy}" r="3" fill="${LN}"/><path d="M${cx-sgn*7} ${cy-8} L${cx+sgn*7} ${cy-4.5}" stroke="${LN}" stroke-width="1.8" stroke-linecap="round"/>`;
      if(kind==='half') return `<path d="M${cx-5.5} ${cy-1} Q${cx} ${cy+0.5} ${cx+5.5} ${cy-1}" stroke="${LN}" stroke-width="1.9" fill="none" stroke-linecap="round"/><circle cx="${cx}" cy="${cy+1.5}" r="2" fill="${LN}"/>`;
      return `<circle cx="${cx}" cy="${cy}" r="2.9" fill="${LN}"/><circle cx="${cx-0.9}" cy="${cy-1}" r=".9" fill="#fff"/>`;
    }
    /* gon：小さい点目＋太眉 */
    if(kind==='shrink'||kind==='hollow') return `<circle cx="${cx}" cy="${cy}" r="4.2" fill="#fff" stroke="${LN}" stroke-width="1.6"/><circle cx="${cx}" cy="${cy}" r="1.2" fill="${LN}"/>`;
    if(kind==='angry') return `<circle cx="${cx}" cy="${cy+0.5}" r="2.8" fill="${LN}"/><path d="M${cx-sgn*8} ${cy-9} L${cx+sgn*8} ${cy-5}" stroke="${LN}" stroke-width="2.6" stroke-linecap="round"/>`;
    if(kind==='half') return `<circle cx="${cx}" cy="${cy+1}" r="2.4" fill="${LN}"/><path d="M${cx-6} ${cy-2.5} L${cx+6} ${cy-2.5}" stroke="${LN}" stroke-width="2.2" stroke-linecap="round"/>`;
    return `<circle cx="${cx}" cy="${cy}" r="2.6" fill="${LN}"/><circle cx="${cx-0.8}" cy="${cy-0.9}" r=".8" fill="#fff"/>`;
  };
  return one(L,-1)+one(R,1);
}

/* ---- 口 ---- */
function mouth(who,kind,y){
  const x=100, s = who==='gon'?1.25:1;
  const fang = who==='piyo' ? `<path d="M${x+3.2} ${y+0.5} l2.2 3.6 2.2 -3.6" fill="#fff" stroke="${LN}" stroke-width="1"/>` : '';
  switch(kind){
    case 'closed': return `<path d="M${x-3.6*s} ${y} Q${x} ${y+2} ${x+3.6*s} ${y}" stroke="${LN}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    case 'smile': return `<path d="M${x-5.5*s} ${y-1} Q${x} ${y+4.5} ${x+5.5*s} ${y-1}" stroke="${LN}" stroke-width="1.9" fill="none" stroke-linecap="round"/>`;
    case 'smirk': return `<path d="M${x-4.5*s} ${y+1.5} Q${x+2} ${y+4} ${x+6.5*s} ${y-2}" stroke="${LN}" stroke-width="1.9" fill="none" stroke-linecap="round"/>`;
    case 'wavy': return `<path d="M${x-6.5*s} ${y} q2.2 3 4.4 0 t4.4 0 t4.4 0" stroke="${LN}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    case 'oo': return `<ellipse cx="${x}" cy="${y+1}" rx="${3*s}" ry="3.8" fill="#e0958c" stroke="${LN}" stroke-width="1.5"/>`;
    case 'open': return `<path d="M${x-6*s} ${y-1} Q${x} ${y+8.5} ${x+6*s} ${y-1} Q${x} ${y+1.5} ${x-6*s} ${y-1} Z" fill="#e0958c" stroke="${LN}" stroke-width="1.6" stroke-linejoin="round"/>${fang}`;
    case 'grin': return `<path d="M${x-8*s} ${y-2} Q${x} ${y+10} ${x+8*s} ${y-2} Q${x} ${y+1.5} ${x-8*s} ${y-2} Z" fill="#e0958c" stroke="${LN}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M${x-6.5*s} ${y-0.8} Q${x} ${y+1.8} ${x+6.5*s} ${y-0.8} L${x+5*s} ${y+1.4} Q${x} ${y+3.8} ${x-5*s} ${y+1.4} Z" fill="#fff"/>${fang}`;
    case 'shout': return `<path d="M${x-7*s} ${y-3.5} Q${x} ${y-6} ${x+7*s} ${y-3.5} Q${x+8*s} ${y+5} ${x} ${y+7.5} Q${x-8*s} ${y+5} ${x-7*s} ${y-3.5} Z" fill="#e0958c" stroke="${LN}" stroke-width="1.7" stroke-linejoin="round"/>`;
    default: return '';
  }
}

/* ---- キャラ本体（頭身高め・華奢） ---- */
function drawChar(who,expr='normal',opt={}){
  const c=CH[who], E=EXPR[expr]||EXPR.normal;
  let p=[];
  const eyeY=80, mouthY=106;

  /* 体（華奢〜がっしり、キャラ別） */
  if(who==='ren'){
    p.push(`<path d="M100 138 C82 140 70 148 66 236 L134 236 C130 148 118 140 100 138 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="${LNW}" stroke-linejoin="round"/>
      <path d="M90 141 L100 156 L110 141" stroke="${c.cloth2}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M78 160 C76 190 75 214 74 236 M122 160 C124 190 125 214 126 236" stroke="${c.cloth2}" stroke-width="1.4" fill="none" opacity=".8"/>`);
  }else if(who==='dai'){
    p.push(`<path d="M100 136 C76 138 62 148 58 236 L142 236 C138 148 124 138 100 136 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="${LNW}" stroke-linejoin="round"/>
      <path d="M82 146 C82 138 118 138 118 146" fill="none" stroke="${c.cloth2}" stroke-width="2.6"/>
      <path d="M93 150 L92 172 M107 150 L108 172" stroke="#fffefb" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="92" cy="174" r="1.6" fill="none" stroke="#fffefb" stroke-width="1.2"/>
      <circle cx="108" cy="174" r="1.6" fill="none" stroke="#fffefb" stroke-width="1.2"/>`);
  }else if(who==='gon'){
    p.push(`<path d="M100 134 C72 136 56 146 52 236 L148 236 C144 146 128 136 100 134 Z" fill="${c.skin}" stroke="${LN}" stroke-width="${LNW}" stroke-linejoin="round"/>
      <path d="M68 158 L68 236 L132 236 L132 158 C116 168 84 168 68 158 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="${LNW}" stroke-linejoin="round"/>
      <path d="M84 146 Q100 158 116 146" stroke="#d8b25c" stroke-width="2.6" fill="none"/>
      <circle cx="100" cy="154" r="2.4" fill="#d8b25c"/>`);
  }else{
    p.push(`<path d="M100 138 C84 140 72 148 68 236 L132 236 C128 148 116 140 100 138 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="${LNW}" stroke-linejoin="round"/>
      <path d="M88 141 C92 150 108 150 112 141" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="100" cy="158" r="2" fill="${c.cloth2}"/><circle cx="100" cy="172" r="2" fill="${c.cloth2}"/>
      <path d="M76 152 C74 180 73 208 72 236 M124 152 C126 180 127 208 128 236" stroke="${c.cloth2}" stroke-width="1.4" fill="none" opacity=".7"/>`);
  }

  /* ぴよ：後ろ髪＋サイドポニー（顔の奥） */
  if(who==='piyo'){
    p.push(`<path d="M62 70 C58 40 76 24 100 24 C124 24 142 40 138 70 C140 92 138 112 132 124 L128 100 L72 100 L68 124 C62 112 60 92 62 70 Z" fill="${c.hair}" stroke="${LN}" stroke-width="${LNW}"/>
      <path d="M136 74 C154 84 160 116 152 146 C148 162 138 174 131 179 C138 154 138 124 130 104 C127 93 128 80 131 75 Z" fill="${c.hair}" stroke="${LN}" stroke-width="${LNW}" stroke-linejoin="round"/>
      <path d="M138 100 C146 122 146 148 139 168 M144 96 C152 118 152 142 147 160" stroke="${c.hairLo}" stroke-width="1.1" fill="none" opacity=".8"/>
      <circle cx="134" cy="79" r="5.5" fill="#f0b8c4" stroke="${LN}" stroke-width="1.3"/>`);
  }

  /* 首（細め） */
  const nw = who==='gon'?13:9;
  p.push(`<path d="M${100-nw} 118 L${100-nw} 144 L${100+nw} 144 L${100+nw} 118 Z" fill="${c.skin}" stroke="none"/>
    <path d="M${100-nw} 120 C${100-nw*0.4} 130 ${100+nw*0.4} 130 ${100+nw} 120" fill="none" stroke="${c.skin==='#fff2e8'?'#f0cfc0':'#e0bfa4'}" stroke-width="1.6" opacity=".8"/>
    <path d="M${100-nw} 118 L${100-nw} 142 M${100+nw} 118 L${100+nw} 142" stroke="${LN}" stroke-width="1.3"/>`);

  /* 頭 */
  const FACE={
    ren:'M100 30 C126 30 141 50 140 74 C139 94 131 110 118 118 C111 122 105 124 100 124 C95 124 89 122 82 118 C69 110 61 94 60 74 C59 50 74 30 100 30 Z',
    dai:'M100 32 C128 32 143 52 142 76 C141 98 132 114 114 120 C105 123 95 123 86 120 C68 114 59 98 58 76 C57 52 72 32 100 32 Z',
    gon:'M100 30 C130 32 145 52 144 78 C143 102 134 116 118 121 C106 124 94 124 82 121 C66 116 57 102 56 78 C55 52 70 32 100 30 Z',
    piyo:'M100 34 C124 34 138 52 137 74 C136 94 129 108 117 116 C110 120 104 122 100 122 C96 122 90 120 83 116 C71 108 64 94 63 74 C62 52 76 34 100 34 Z'
  };
  p.push(`<path d="${FACE[who]}" fill="${c.skin}" stroke="${LN}" stroke-width="${LNW}"/>`);

  /* 耳 */
  if(who!=='piyo'){
    p.push(`<path d="M60 78 C52 75 51 84 56 90 C59 94 63 93 64 88" fill="${c.skin}" stroke="${LN}" stroke-width="1.3"/>
      <path d="M140 78 C148 75 149 84 144 90 C141 94 137 93 136 88" fill="${c.skin}" stroke="${LN}" stroke-width="1.3"/>`);
  }

  /* 目・鼻・口 */
  p.push(eyes(who,E.e,eyeY));
  if(who==='gon') p.push(`<ellipse cx="100" cy="94" rx="6" ry="4.6" fill="${c.skin}" stroke="${LN}" stroke-width="1.5"/>`);
  else if(who==='dai') p.push(`<circle cx="100" cy="94" r="2.6" fill="none" stroke="${LN}" stroke-width="1.3"/>`);
  else p.push(`<path d="M100 91 q1.6 2.4 0 4.2" stroke="${LN}" stroke-width="1.2" fill="none" stroke-linecap="round"/>`);
  p.push(mouth(who,E.m,mouthY));

  /* チーク（斜線＋淡い色） */
  const blush = who==='piyo' || ['soft','happy','cry','grin'].includes(expr);
  if(blush){
    const by=94;
    p.push(`<ellipse cx="72" cy="${by}" rx="7" ry="3.6" fill="#f2b0ac" opacity=".55"/>
      <ellipse cx="128" cy="${by}" rx="7" ry="3.6" fill="#f2b0ac" opacity=".55"/>
      <path d="M68 ${by-2} l3 4 M73 ${by-3} l3 4" stroke="#dd8a86" stroke-width="1.1" stroke-linecap="round" opacity=".85"/>
      <path d="M124 ${by-2} l3 4 M129 ${by-3} l3 4" stroke="#dd8a86" stroke-width="1.1" stroke-linecap="round" opacity=".85"/>`);
  }

  /* キャラ固有 */
  if(who==='dai'){
    p.push(`<path d="M${100-16-6} ${eyeY+8} q6 3.6 12 0" fill="none" stroke="#d8b294" stroke-width="1.3"/>
      <path d="M${100+16-6} ${eyeY+8} q6 3.6 12 0" fill="none" stroke="#d8b294" stroke-width="1.3"/>`);
    let st='';
    for(let i=0;i<9;i++){const a=Math.PI*(0.25+0.5*sr(i));const r=19+sr(i+40)*4;
      st+=`<circle cx="${100+Math.cos(a)*r}" cy="${106+Math.sin(a)*r*0.5}" r=".9" fill="${LN}" opacity=".5"/>`;}

function focusLines(color,cx,cy,n,inner){
  let s='';
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, j=sr(i)*0.035, ir=inner+sr(i+99)*46;
    const x1=cx+Math.cos(a)*ir, y1=cy+Math.sin(a)*ir;
    const x2=cx+Math.cos(a-0.02-j)*560, y2=cy+Math.sin(a-0.02-j)*560;
    const x3=cx+Math.cos(a+0.02+j)*560, y3=cy+Math.sin(a+0.02+j)*560;
    s+=`<polygon points="${x1},${y1} ${x2},${y2} ${x3},${y3}" fill="${color}"/>`;
  }
  return s;
}

function panel(p){
  let inner=`<div class="stage">`;
  if(p.scene && SCENES[p.scene]) inner+=SCENES[p.scene]();
  (p.ch||[]).forEach(c=>{
    const w=(c.w||46)*0.85;
    inner+=`<div class="ch" style="left:${c.x}%;bottom:${c.b??0}%;width:${w}%;">${drawChar(c.who,c.e,{flip:c.flip})}</div>`;
    if(c.tag) inner+=`<div class="name" style="left:${c.x+2}%;bottom:${(c.b??0)+2}%">${c.tag}</div>`;
  });
  if(p.fg && FG[p.fg]) inner+=FG[p.fg]();
  (p.sfx||[]).forEach(s=>{
    inner+=`<div class="sfx" style="left:${s.x}%;top:${s.y}%;font-size:${s.s||24}px;${s.r?`transform:rotate(${s.r}deg)`:''}">${s.t}</div>`;
  });
  (p.naru||[]).forEach(n=>{ inner+=`<div class="naru" style="${n.pos||'top:4%;left:4%'}">${n.t}</div>`; });
  (p.bub||[]).forEach(b=>{
    const cls=b.k==='think'?'bub think':b.k==='shout'?'bub shout':'bub';
    inner+=`<div class="${cls}" style="${b.pos}">${b.t}</div>`;
  });
  inner+=`</div>`;
  return `<div class="panel" style="flex-grow:${p.f||1};min-height:${(p.h||160)+30}px">${inner}</div>`;
}
function page(pg){
  const rows=pg.rows.map(r=>`<div class="row">${r.map(panel).join('')}</div>`).join('');
  return `<div class="page">${rows}<div class="pagenum">— ${pg.n} —</div></div>`;
}

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひとりごと ―アキラの四十二年―</title>
<style>
  :root{ --ink:#3a322e; --paper:#f4f0e8; --panel:#fbfaf6; }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:#c8c2b8; color:#3a322e;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Zen Maru Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .book{ max-width:820px; margin:0 auto; padding:24px 14px 80px; }
  .cover{
    background:var(--panel); border:2px solid var(--ink); border-radius:4px;
    padding:38px 24px 30px; text-align:center; margin-bottom:28px;
    box-shadow:0 8px 22px rgba(58,50,46,.3);
  }
  .cover h1{ font-size:30px; margin:0 0 8px; letter-spacing:.14em; font-weight:700; color:#3a322e; }
  .cover .ep{ font-size:15px; font-weight:600; margin:6px 0 2px; color:#7a6a5c; }
  .cover .sub{ font-size:12px; color:#9a8a7c; letter-spacing:.12em; line-height:1.8; }
  .cast{ display:flex; justify-content:center; align-items:flex-end; gap:6px; margin:18px 0 8px; }
  .cast div{ width:110px; }
  .cast svg{ width:100%; display:block; }
  .castname{ font-size:11px; font-weight:700; color:#8a7666; }
  .page{
    background:var(--paper); border:2px solid var(--ink); border-radius:4px;
    padding:12px; margin:0 auto 26px; box-shadow:0 8px 22px rgba(58,50,46,.3);
    position:relative;
  }
  .pagenum{
    position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    font-size:12px; color:#b0a190; font-weight:700;
  }
  .row{ display:flex; flex-direction:row-reverse; gap:10px; margin-bottom:10px; }
  .row:last-child{ margin-bottom:14px; }
  .panel{
    position:relative; background:var(--panel); border:2px solid var(--ink);
    border-radius:2px; overflow:hidden; flex:1 1 0;
  }
  .stage{ position:absolute; inset:0; }
  .scene{ position:absolute; inset:0; width:100%; height:100%; filter:saturate(.35) contrast(1.02); }
  .ch{ position:absolute; z-index:2; }
  .ch svg{ display:block; width:100%; height:auto; overflow:visible; }
  .bub{
    position:absolute; background:#fff; border:1.6px solid var(--ink);
    border-radius:14px; padding:7px 11px; text-align:center;
    font-weight:600; line-height:1.4; font-size:13px; letter-spacing:.01em;
    z-index:5; white-space:nowrap; color:#3a322e;
  }
  .bub small{ font-size:11px; }
  .bub.think{ border-style:dotted; border-width:2px; border-radius:22px; background:#fbfaf2; }
  .naru{
    position:absolute; background:#faf8f0; border:1.6px solid var(--ink);
    border-radius:2px; padding:7px 11px; font-size:12.5px; font-weight:600;
    white-space:nowrap; line-height:1.55; z-index:5; color:#3a322e;
  }
  .naru.dark{ background:#4a4440; color:#f4f0e8; border-color:#2a2622; }
  .sfx{
    position:absolute; font-weight:900; color:#8a7666;
    font-size:22px; letter-spacing:.02em;
    transform:rotate(-6deg); pointer-events:none; z-index:4;
  }
  .name{ position:absolute; font-size:10px; font-weight:700; color:#8a7666;
    background:rgba(255,255,255,.9); padding:1px 6px; border-radius:6px; z-index:5;
    border:1px solid rgba(58,50,46,.35); }
  .endcard{ text-align:center; color:#6a5c50; padding:10px 0 0; font-weight:700; letter-spacing:.2em; }
  .ephead{ background:#4a4440; color:#f4f0e8; border:2px solid var(--ink); border-radius:4px;
    padding:10px 16px; margin:6px auto 16px; font-weight:700; letter-spacing:.12em; text-align:center;
    font-size:15px; box-shadow:0 4px 12px rgba(58,50,46,.3); }
  .ephead small{ display:block; font-size:11px; color:#c9beb2; letter-spacing:.2em; margin-bottom:2px; }
  .note{ background:var(--panel); border:1.6px dashed var(--ink); border-radius:4px;
    padding:16px 18px; font-size:12.5px; line-height:1.85; }
  .note h3{ margin:0 0 8px; font-size:14px; }
</style>
</head>
<body>
<div class="book" id="book"></div>

<script>
/* ========= 作画エンジン ========= */
let uid=0;
const LN='#28211c';
const sr=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};

/* eyeStyle: big(15歳)/narrow(成人)/tired(40代)/dot(脇役) */
const CH={
  boy: { skin:'#eee0d0', hair:'#2e2822', hairHi:'#514840', cloth:'#84888e', cloth2:'#72767c',
         iris:'#54443a', irisD:'#38291f', eye:'big', burly:0 },
  man: { skin:'#e8d8c4', hair:'#28221c', hairHi:'#4a423a', cloth:'#4e4f55', cloth2:'#3f4045',
         iris:'#463a30', irisD:'#2e241c', eye:'narrow', burly:1 },
  old: { skin:'#e6dcd0', hair:'#847c74', hairHi:'#a29a92', cloth:'#848a90', cloth2:'#71777d',
         iris:'#463a30', irisD:'#2e241c', eye:'tired', burly:1 },
  kazu:{ skin:'#ecdcc6', hair:'#b8a684', hairHi:'#d0c0a0', cloth:'#8a6a6a', cloth2:'#785a5a',
         iris:'#4e4034', irisD:'#342820', eye:'big', burly:0 },
  doc: { skin:'#ecdece', hair:'#3e3830', hairHi:'#5c554c', cloth:'#efede6', cloth2:'#d8d5ca',
         iris:'#3a3430', irisD:'#241f1b', eye:'dot', burly:1 },
  kid: { skin:'#eee2d2', hair:'#3a322a', hairHi:'#584e44', cloth:'#727a72', cloth2:'#626a62',
         iris:'#4e4034', irisD:'#342820', eye:'big', burly:0 }
};

const EXPR={
  normal:{e:'open',m:'closed'},
  deadpan:{e:'half',m:'closed'},
  soft:{e:'closedHappy',m:'smile'},
  happy:{e:'closedHappy',m:'open'},
  grin:{e:'open',m:'grin'},
  dead:{e:'flat',m:'wavy'},
  hollow:{e:'hollow',m:'closed'},
  cry:{e:'closedSad',m:'wavy',tear:1},
  crysoft:{e:'closedHappy',m:'smile',tear:1},
  shock:{e:'shrink',m:'oo',sweat:1},
  sad:{e:'half',m:'frown'},
  x:{e:'xx',m:'wavy'}
};

function eyes(who,kind,cy){
  const c=CH[who], style=c.eye;
  const dx = 15;
  const one=(cx,sgn)=>{
    if(kind==='closedHappy'){
      return `<path d="M${cx-7} ${cy+1} Q${cx} ${cy-5.5} ${cx+7} ${cy+1}" stroke="${LN}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    }
    if(kind==='closedSad') return `<path d="M${cx-7} ${cy-1} Q${cx} ${cy+5} ${cx+7} ${cy-1}" stroke="${LN}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    if(kind==='flat'){
      let s=`<path d="M${cx-6.5} ${cy} L${cx+6.5} ${cy}" stroke="${LN}" stroke-width="1.9" stroke-linecap="round"/>`;
      if(style==='tired') s+=`<path d="M${cx-5} ${cy+6} q5 3 10 0" stroke="#c0a488" stroke-width="1.3" fill="none"/>`;
      return s;
    }
    if(kind==='xx') return `<path d="M${cx-5} ${cy-4.5} L${cx+5} ${cy+4.5} M${cx+5} ${cy-4.5} L${cx-5} ${cy+4.5}" stroke="${LN}" stroke-width="2" stroke-linecap="round"/>`;

    if(style==='big'){
      const hollow = kind==='hollow', shrink = kind==='shrink';
      const rx = shrink?3.2:4.8, ry = shrink?4.2:6.4;
      let s=`<path d="M${cx-7} ${cy-5.5} Q${cx} ${cy-8} ${cx+7} ${cy-5.5} L${cx+7.4} ${cy+5} Q${cx} ${cy+7.5} ${cx-7.4} ${cy+5} Z" fill="#fff"/>`;
      s+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${c.iris}" stroke="${c.irisD}" stroke-width="1.3"/>`;
      s+=`<ellipse cx="${cx}" cy="${cy+1}" rx="1.7" ry="2.4" fill="#241812"/>`;
      if(!hollow && !shrink) s+=`<circle cx="${cx-2.2}" cy="${cy-2.4}" r="2" fill="#fff"/><circle cx="${cx+2.6}" cy="${cy+2.8}" r="1" fill="#fff" opacity=".95"/>`;
      if(shrink) s+=`<circle cx="${cx-1.6}" cy="${cy-1.8}" r=".9" fill="#fff" opacity=".8"/>`;
      s+=`<path d="M${cx-8.6} ${cy-6.5} Q${cx} ${cy-10.5} ${cx+8.6} ${cy-6.5}" fill="none" stroke="${LN}" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M${cx-5.5} ${cy+9} Q${cx} ${cy+10.5} ${cx+5.5} ${cy+9}" fill="none" stroke="${LN}" stroke-width="1" opacity=".55"/>`;
      return s;
    }
    if(style==='narrow'){
      const half=(kind==='half'), shrink=(kind==='shrink');
      const topY = half? cy-1.5 : cy-3.5;
      let s=`<path d="M${cx-8.5} ${cy+1} Q${cx} ${cy+4} ${cx+7.5} ${cy+2} L${cx+7.5} ${topY} L${cx-8.5} ${topY+1} Z" fill="#fff"/>`;
      const ir = shrink?2.4:3.6;
      s+=`<ellipse cx="${cx}" cy="${cy+1}" rx="${ir}" ry="${ir+1.3}" fill="${c.iris}" stroke="${c.irisD}" stroke-width="1"/>
          <ellipse cx="${cx}" cy="${cy+1.5}" rx="1.2" ry="1.6" fill="#1c1512"/>`;
      if(!shrink) s+=`<circle cx="${cx-1.3}" cy="${cy-0.3}" r=".8" fill="#fff"/>`;
      s+=`<path d="M${cx-9.5} ${topY+1.5} Q${cx-1} ${topY-2.5} ${cx+7.5} ${topY}" fill="none" stroke="${LN}" stroke-width="2.6" stroke-linecap="round"/>`;
      return s;
    }
    if(style==='tired'){
      const shrink=(kind==='shrink');
      let s=`<path d="M${cx-8} ${cy+1} Q${cx} ${cy+3.5} ${cx+7} ${cy+1.5} L${cx+7} ${cy-1.5} L${cx-8} ${cy-1} Z" fill="#fff"/>`;
      const ir = shrink?2:3;
      s+=`<ellipse cx="${cx}" cy="${cy+0.5}" rx="${ir}" ry="${ir+1}" fill="${c.iris}"/>`;
      s+=`<path d="M${cx-9} ${cy-1} Q${cx-1} ${cy-3.5} ${cx+7} ${cy-1.5}" fill="none" stroke="${LN}" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M${cx-5.5} ${cy+6} q5.5 3.4 11 0" stroke="#c0a488" stroke-width="1.4" fill="none"/>`;
      return s;
    }
    /* dot */
    if(kind==='shrink') return `<circle cx="${cx}" cy="${cy}" r="4" fill="#fff" stroke="${LN}" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="1.1" fill="${LN}"/>`;
    if(kind==='half') return `<path d="M${cx-5.5} ${cy-1.5} Q${cx} ${cy} ${cx+5.5} ${cy-1.5}" stroke="${LN}" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="${cx}" cy="${cy+1}" r="1.8" fill="${LN}"/>`;
    return `<circle cx="${cx}" cy="${cy}" r="2.5" fill="${LN}"/><circle cx="${cx-0.8}" cy="${cy-0.9}" r=".7" fill="#fff"/>`;
  };
  return one(100-dx,-1)+one(100+dx,1);
}

function mouth(who,kind,y){
  const x=100;
  switch(kind){
    case 'closed': return `<path d="M${x-4} ${y} Q${x} ${y+1.8} ${x+4} ${y}" stroke="${LN}" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
    case 'smile': return `<path d="M${x-5.5} ${y-1} Q${x} ${y+4} ${x+5.5} ${y-1}" stroke="${LN}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    case 'frown': return `<path d="M${x-5.5} ${y+2} Q${x} ${y-2.5} ${x+5.5} ${y+2}" stroke="${LN}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    case 'wavy': return `<path d="M${x-6} ${y} q2 2.8 4 0 t4 0 t4 0" stroke="${LN}" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
    case 'oo': return `<ellipse cx="${x}" cy="${y+1}" rx="3" ry="3.6" fill="#c67c72" stroke="${LN}" stroke-width="1.4"/>`;
    case 'open': return `<path d="M${x-5.5} ${y-1} Q${x} ${y+7.5} ${x+5.5} ${y-1} Q${x} ${y+1.5} ${x-5.5} ${y-1} Z" fill="#c67c72" stroke="${LN}" stroke-width="1.4" stroke-linejoin="round"/>`;
    case 'grin': return `<path d="M${x-7.5} ${y-2} Q${x} ${y+9} ${x+7.5} ${y-2} Q${x} ${y+1.5} ${x-7.5} ${y-2} Z" fill="#c67c72" stroke="${LN}" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M${x-6} ${y-0.8} Q${x} ${y+1.4} ${x+6} ${y-0.8} L${x+4.6} ${y+1.1} Q${x} ${y+3.1} ${x-4.6} ${y+1.1} Z" fill="#fff"/>`;
    default: return '';
  }
}

function drawChar(who,expr='normal',opt={}){
  const c=CH[who], E=EXPR[expr]||EXPR.normal;
  let p=[];
  const eyeY=72, mouthY=101;

  /* 体 */
  if(who==='boy'||who==='kid'){
    p.push(`<path d="M100 136 C76 139 62 148 56 260 L144 260 C138 148 124 139 100 136 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M82 146 C82 138 118 138 118 146" fill="none" stroke="${c.cloth2}" stroke-width="2.2"/>
      <path d="M93 150 L92 172 M107 150 L108 172" stroke="#f4f2ec" stroke-width="1.6" stroke-linecap="round"/>`);
  }else if(who==='man'){
    p.push(`<path d="M100 130 C64 134 46 144 40 260 L160 260 C154 144 136 134 100 130 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M86 133 L100 160 L114 133 Z" fill="${c.skin}" stroke="${LN}" stroke-width="1.6"/>
      <path d="M95 146 q2.5 -3.5 5 0 M99 152 q2.5 -3.5 5 0" stroke="${LN}" stroke-width="1.2" fill="none" opacity=".8"/>
      <path d="M100 160 L100 260" stroke="${c.cloth2}" stroke-width="1.8"/>
      <path d="M60 172 C58 202 57 232 56 260 M140 172 C142 202 143 232 144 260" stroke="${c.cloth2}" stroke-width="1.4" fill="none" opacity=".9"/>
      <path d="M52 190 q14 8 28 4 M148 190 q-14 8 -28 4" stroke="${c.cloth2}" stroke-width="1.3" fill="none" opacity=".7"/>`);
  }else if(who==='old'){
    p.push(`<path d="M100 132 C68 136 50 146 44 260 L156 260 C150 146 132 136 100 132 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M86 136 C90 148 110 148 114 136" fill="none" stroke="#eef0f0" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M100 148 L100 260" stroke="${c.cloth2}" stroke-width="1.6" opacity=".9"/>`);
  }else if(who==='doc'){
    p.push(`<path d="M100 130 C66 134 48 144 42 260 L158 260 C152 144 134 134 100 130 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M91 139 L100 154 L109 139 L113 144 L102 164 L100 168 L98 164 L87 144 Z" fill="#c8d4dc" stroke="${LN}" stroke-width="1.2"/>
      <path d="M100 154 L100 260 M74 160 C72 194 71 228 70 260 M126 160 C128 194 129 228 130 260" stroke="${c.cloth2}" stroke-width="1.4" fill="none"/>
      <path d="M62 200 h18 M120 200 h18" stroke="${c.cloth2}" stroke-width="1.4"/>`);
  }else{ /* kazu */
    p.push(`<path d="M100 136 C76 139 62 148 56 260 L144 260 C138 148 124 139 100 136 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M84 143 C88 152 112 152 116 143" fill="none" stroke="#f4e8d8" stroke-width="2.4" stroke-linecap="round"/>`);
  }

  /* 首 */
  const nw = c.burly?15:9;
  p.push(`<path d="M${100-nw} 104 L${100-nw} 140 L${100+nw} 140 L${100+nw} 104 Z" fill="${c.skin}"/>
    <path d="M${100-nw} 108 C${100-nw*0.3} 118 ${100+nw*0.3} 118 ${100+nw} 108" fill="none" stroke="#c8ab8e" stroke-width="1.4" opacity=".8"/>
    <path d="M${100-nw} 104 L${100-nw} 139 M${100+nw} 104 L${100+nw} 139" stroke="${LN}" stroke-width="1.3"/>`);
  if(c.burly) p.push(`<path d="M${100-nw} 126 L${100-nw-16} 140 M${100+nw} 126 L${100+nw+16} 140" stroke="${LN}" stroke-width="1.6" fill="none"/>
    <path d="M${100-nw+2} 112 L${100-nw+2} 136 M${100+nw-2} 112 L${100+nw-2} 136" stroke="#c8ab8e" stroke-width="1.2" opacity=".7"/>`);

  /* 顔 */
  const FACE={
    boy:'M100 26 C121 26 133 41 132 60 C131 78 125 91 114 99 C108 104 103 106 100 106 C97 106 92 104 86 99 C75 91 69 78 68 60 C67 41 79 26 100 26 Z',
    kid:'M100 26 C121 26 133 41 132 60 C131 78 125 91 114 99 C108 104 103 106 100 106 C97 106 92 104 86 99 C75 91 69 78 68 60 C67 41 79 26 100 26 Z',
    kazu:'M100 26 C121 26 133 41 132 60 C131 78 125 91 114 99 C108 104 103 106 100 106 C97 106 92 104 86 99 C75 91 69 78 68 60 C67 41 79 26 100 26 Z',
    man:'M100 22 C126 22 139 36 138 56 C137 72 135 86 130 94 C123 103 111 108 100 108 C89 108 77 103 70 94 C65 86 63 72 62 56 C61 36 74 22 100 22 Z',
    old:'M100 22 C124 22 137 37 136 56 C135 73 132 87 127 95 C120 104 110 108 100 108 C90 108 80 104 73 95 C68 87 65 73 64 56 C63 37 76 22 100 22 Z',
    doc:'M100 22 C126 22 139 37 138 57 C137 74 134 88 128 96 C121 104 110 108 100 108 C90 108 79 104 72 96 C66 88 63 74 62 57 C61 37 74 22 100 22 Z'
  };
  p.push(`<path d="${FACE[who]}" fill="${c.skin}" stroke="${LN}" stroke-width="1.7"/>`);
  p.push(`<path d="M68 62 C61 60 60 68 64 73 C67 77 70 76 71 72" fill="${c.skin}" stroke="${LN}" stroke-width="1.1"/>
    <path d="M132 62 C139 60 140 68 136 73 C133 77 130 76 129 72" fill="${c.skin}" stroke="${LN}" stroke-width="1.1"/>`);

  /* こけた頬（old） */
  if(who==='old') p.push(`<path d="M80 92 C78 98 79 103 82 106 M120 92 C122 98 121 103 118 106" stroke="#cbb098" stroke-width="1.3" fill="none"/>`);

  p.push(eyes(who,E.e,eyeY));
  p.push(`<path d="M101 78 C100 83 99 87 98 90 Q100 92 102.5 90.5" fill="none" stroke="${LN}" stroke-width="1.2" stroke-linecap="round"/>`);
  p.push(mouth(who,E.m,mouthY));

  /* 眉 */
  const bY = c.burly? eyeY-10 : eyeY-13;
  const bw2 = c.burly? 7 : 5, bth = c.burly? 4.2 : 1.8;
  const tilt = (E.e==='closedSad'||expr==='sad'||expr==='cry')?2.5:0;
  p.push(`<path d="M${85-bw2} ${bY+2+tilt} Q${85} ${bY-1+tilt*0.4} ${85+bw2} ${bY+1-tilt*0.6}" stroke="${LN}" stroke-width="${bth}" fill="none" stroke-linecap="round"/>
    <path d="M${115-bw2} ${bY+1-tilt*0.6} Q${115} ${bY-1+tilt*0.4} ${115+bw2} ${bY+2+tilt}" stroke="${LN}" stroke-width="${bth}" fill="none" stroke-linecap="round"/>`);
  if(c.burly){
    /* 彫りの深い目元・立体的な鼻・唇 */
    p.push(`<path d="M${85-7} ${eyeY-6} q7 -2.5 14 0 M${115-7} ${eyeY-6} q7 -2.5 14 0" stroke="#c0a284" stroke-width="1.2" fill="none" opacity=".8"/>`);
    p.push(`<path d="M97 ${eyeY-8} C96 ${eyeY+4} 94 ${eyeY+13} 92 ${eyeY+17} Q97 ${eyeY+22} 105 ${eyeY+19} Q107 ${eyeY+16} 105 ${eyeY+13}" stroke="${LN}" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M92 ${eyeY+18} q-2.4 1 -1.4 3 M106 ${eyeY+18} q2.4 1 1.4 3" stroke="${LN}" stroke-width="1.3" fill="none" stroke-linecap="round"/>`);
    p.push(`<path d="M93 ${mouthY+5} Q100 ${mouthY+7.5} 107 ${mouthY+5}" stroke="#a8846a" stroke-width="1.5" fill="none" stroke-linecap="round"/>`);
    /* 頬のハッチング */
    p.push(`<g stroke="${LN}" stroke-width=".9" opacity=".28">
      <path d="M70 84 l7 -5 M72 90 l8 -5.5 M74 96 l8 -5.5 M126 80 l7 5 M125 87 l8 5.5 M124 94 l8 5.5"/></g>`);
  }

  /* キャラ固有 */
  if(who==='doc'){
    p.push(`<g fill="none" stroke="${LN}" stroke-width="1.5">
      <rect x="76" y="${eyeY-7}" width="17" height="13" rx="2.5"/><rect x="107" y="${eyeY-7}" width="17" height="13" rx="2.5"/>
      <path d="M93 ${eyeY-1} L107 ${eyeY-1} M76 ${eyeY-3} L68 ${eyeY-5} M124 ${eyeY-3} L132 ${eyeY-5}"/></g>`);
  }
  if(who==='old'||who==='man'||who==='doc'){
    let st='';
    const col = who==='old' ? '#7c746c' : LN;
    for(let i=0;i<30;i++){const a=Math.PI*(0.12+0.76*sr(i+3));const r=20+sr(i+40)*9;
      st+=`<circle cx="${100+Math.cos(a)*r}" cy="${100+Math.sin(a)*r*0.62}" r="1.05" fill="${col}" opacity=".75"/>`;}
    st+=`<path d="M90 ${100+12} Q100 ${100+16} 110 ${100+12}" stroke="${col}" stroke-width="1.2" fill="none" opacity=".5"/>`;
    p.push(st);
  }
  if(who==='doc'){
    p.push(`<path d="M90 96 Q100 100 110 96" stroke="${LN}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`);
  }

  /* 髪 */
  if(who==='boy'||who==='man'){
    p.push(`<path d="M64 66 C60 32 78 18 100 18 C122 18 140 32 136 66
      L131 55 L128 64 L124 50 L119 60 L114 46 L108 58 L102 45 L96 58 L90 46 L84 60 L79 50 L74 64 L69 56 L66 68 Z"
      fill="${c.hair}" stroke="${LN}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M64 64 C62 76 63 84 66 92 C68 82 68 74 70 66 Z" fill="${c.hair}" stroke="${LN}" stroke-width="1.1" stroke-linejoin="round"/>

/* ========= 背景 ========= */
function focusLines(color,cx,cy,n,inner){
  let s='';
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, j=sr(i)*0.035, ir=inner+sr(i+99)*46;
    const x1=cx+Math.cos(a)*ir, y1=cy+Math.sin(a)*ir;
    const x2=cx+Math.cos(a-0.02-j)*560, y2=cy+Math.sin(a-0.02-j)*560;
    const x3=cx+Math.cos(a+0.02+j)*560, y3=cy+Math.sin(a+0.02+j)*560;
    s+=`<polygon points="${x1},${y1} ${x2},${y2} ${x3},${y3}" fill="${color}"/>`;
  }
  return s;
}
function petals(n,seed){
  let s='';
  for(let i=0;i<n;i++){
    const x=sr(i+seed)*400, y=sr(i+seed+50)*250, r=3+sr(i+seed+90)*4, rot=sr(i+seed+30)*360;
    s+=`<path d="M${x} ${y} q${r} ${-r*0.8} ${r*1.6} 0 q${-r*0.8} ${r*1.1} ${-r*1.6} 0 Z" fill="#f2c4d0" opacity="${0.5+sr(i+seed+7)*0.5}" transform="rotate(${rot} ${x} ${y})"/>`;
  }
  return s;
}
function svgScene(inner){ return `<svg class="scene" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice">${inner}</svg>`; }

/* ========= レンダラ ========= */
function panel(p){
  let inner=`<div class="stage">`;
  if(p.scene && SCENES[p.scene]) inner+=SCENES[p.scene]();
  (p.ch||[]).forEach(c=>{
    const w=(c.w||46)*0.8;
    inner+=`<div class="ch" style="left:${c.x}%;bottom:${c.b??0}%;width:${w}%;">${drawChar(c.who,c.e,{flip:c.flip})}</div>`;
    if(c.tag) inner+=`<div class="name" style="left:${c.x+2}%;bottom:${(c.b??0)+2}%">${c.tag}</div>`;
  });
  (p.sfx||[]).forEach(s=>{
    inner+=`<div class="sfx" style="left:${s.x}%;top:${s.y}%;font-size:${s.s||22}px;${s.r?`transform:rotate(${s.r}deg)`:''}">${s.t}</div>`;
  });
  (p.naru||[]).forEach(n=>{ inner+=`<div class="naru ${n.d?'dark':''}" style="${n.pos||'top:4%;left:4%'}">${n.t}</div>`; });
  (p.bub||[]).forEach(b=>{
    const cls=b.k==='think'?'bub think':'bub';
    inner+=`<div class="${cls}" style="${b.pos}">${b.t}</div>`;
  });
  inner+=`</div>`;
  return `<div class="panel" style="flex-grow:${p.f||1};min-height:${(p.h||160)+30}px">${inner}</div>`;
}
function page(pg){
  const rows=pg.rows.map(r=>`<div class="row">${r.map(panel).join('')}</div>`).join('');
  return `<div class="page">${rows}<div class="pagenum">— ${pg.n} —</div></div>`;
}

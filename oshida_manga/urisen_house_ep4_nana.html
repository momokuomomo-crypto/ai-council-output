<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ウリ専ハウスへようこそ 第2話（少女漫画版）</title>
<style>
  :root{ --ink:#3a322e; --paper:#f6f2ea; --panel:#fdfcf8; }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:#d8cfc2; color:#3a322e;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Zen Maru Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .book{ max-width:820px; margin:0 auto; padding:24px 14px 80px; }
  .cover{
    background:var(--panel); border:2px solid var(--ink); border-radius:4px;
    padding:34px 24px 26px; text-align:center; margin-bottom:28px;
    box-shadow:0 8px 22px rgba(58,50,46,.3);
  }
  .cover h1{ font-size:34px; margin:0 0 6px; letter-spacing:.1em; font-weight:800;
    color:#b03a5a; text-shadow:1px 1px 0 rgba(58,50,46,.3); font-style:italic; }
  .cover .ep{ font-size:19px; font-weight:700; margin:8px 0 2px; }
  .cover .sub{ font-size:13px; color:#9a8a7c; letter-spacing:.15em; }
  .cast{ display:flex; justify-content:center; align-items:flex-end; gap:2px; margin:14px 0 6px; }
  .cast div{ width:120px; }
  .cast svg{ width:100%; display:block; }
  .castname{ font-size:11px; font-weight:700; color:#8a7666; }
  .page{
    background:var(--paper); border:2px solid var(--ink); border-radius:4px;
    padding:12px; margin:0 auto 26px; box-shadow:0 8px 22px rgba(58,50,46,.3);
    position:relative;
  }
  .pagenum{
    position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    font-size:12px; color:#b0a190; font-weight:700;
  }
  .row{ display:flex; flex-direction:row-reverse; gap:10px; margin-bottom:10px; }
  .row:last-child{ margin-bottom:14px; }
  .panel{
    position:relative; background:var(--panel); border:2px solid var(--ink);
    border-radius:2px; overflow:hidden; flex:1 1 0;
  }
  .stage{ position:absolute; inset:0; }
  .scene{ position:absolute; inset:0; width:100%; height:100%; }
  .ch{ position:absolute; z-index:2; }
  .ch svg{ display:block; width:100%; height:auto; overflow:visible; }
  .bub{
    position:absolute; background:#fff; border:1.8px solid var(--ink);
    border-radius:14px; padding:7px 11px; text-align:center;
    font-weight:600; line-height:1.38; font-size:13px; letter-spacing:.01em;
    z-index:5; white-space:nowrap; color:#3a322e;
  }
  .bub small{ font-size:11px; }
  .bub.think{ border-style:dotted; border-width:2.2px; border-radius:22px; background:#fdfbf4; }
  .bub.shout{
    border-radius:6px; background:#fff; color:#b03a5a; border-color:#b03a5a;
    border-width:2px; padding:9px 12px; font-weight:700;
  }
  .naru{
    position:absolute; background:#fdfbf4; border:1.8px solid var(--ink);
    border-radius:2px; padding:6px 10px; font-size:12px; font-weight:600;
    white-space:nowrap; line-height:1.38; z-index:5; color:#3a322e;
  }
  .sfx{
    position:absolute; font-weight:900; color:#8a7666;
    font-size:24px; letter-spacing:.02em;
    transform:rotate(-6deg); pointer-events:none; z-index:4;
  }
  .name{ position:absolute; font-size:10px; font-weight:700; color:#8a7666;
    background:rgba(255,255,255,.9); padding:1px 6px; border-radius:6px; z-index:5;
    border:1px solid rgba(58,50,46,.35); }
  .endcard{ text-align:center; color:#8a7666; padding:10px 0 0; font-weight:700; }
  .note{ background:var(--panel); border:1.8px dashed var(--ink); border-radius:4px;
    padding:16px 18px; font-size:13px; line-height:1.7; }
  .note h3{ margin:0 0 8px; }
</style>
</head>
<body>
<div class="book" id="book"></div>

<script>
/* ========= 作画エンジン：少女漫画スタイル ========= */
let uid=0;
const LN='#3a322e';
const sr=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};

const CH={
  oshida: { skin:'#f8e6d6', hair:'#2c2624', hairHi:'#5a504a', cloth:'#2e2a28', cloth2:'#443e3a',
         iris:'#5a6a72', irisD:'#39434a' },
  shimoda: { skin:'#f2dcc0', hair:'#947652', hairHi:'#b09068', cloth:'#8e9c82', cloth2:'#7c8a70' },
  ueno: { skin:'#e6bb8e', hair:'#3a2f26', hairHi:'#55463a', cloth:'#efe9da', cloth2:'#ded6c2' },
  shia:{ skin:'#fdeee2', hair:'#c89468', hairHi:'#e0b488', cloth:'#f3d9df', cloth2:'#e0a8b8',
         iris:'#b8825a', irisD:'#7a4e34' },
  tanaka:{ skin:'#f4e0c8', hair:'#7c746a', hairHi:'#98908a', cloth:'#7a7a84', cloth2:'#68686f' },
  ooya:{ skin:'#f6e4d0', hair:'#a8a09a', hairHi:'#c2bab4', cloth:'#9a8474', cloth2:'#877264' }
};

const EXPR={
  normal:{e:'open',m:'closed'},
  deadpan:{e:'half',m:'closed'},
  smug:{e:'half',m:'smirk',fx:'spark'},
  soft:{e:'closedHappy',m:'smile'},
  happy:{e:'closedHappy',m:'open'},
  grin:{e:'open',m:'grin'},
  dead:{e:'flat',m:'wavy'},
  cry:{e:'closedSad',m:'wavy',tear:1},
  shock:{e:'shrink',m:'oo',sweat:1},
  yell:{e:'angry',m:'shout'},
  blank:{e:'hollow',m:'oo'},
  x:{e:'xx',m:'wavy',sweat:1}
};

function eyes(who,kind,cy){
  const c=CH[who];
  const dx = who==='ueno'?19:15;
  const one=(cx,sgn)=>{
    if(kind==='closedHappy'){
      let s=`<path d="M${cx-7} ${cy+1} Q${cx} ${cy-5.5} ${cx+7} ${cy+1}" stroke="${LN}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
      if(who==='shia'||who==='oshida') s+=`<path d="M${cx+sgn*6.5} ${cy-1.5} l${sgn*2.6} -2 M${cx+sgn*4} ${cy-3.5} l${sgn*2} -2.4" stroke="${LN}" stroke-width="1.2" stroke-linecap="round"/>`;
      return s;
    }
    if(kind==='closedSad') return `<path d="M${cx-7} ${cy-1} Q${cx} ${cy+5} ${cx+7} ${cy-1}" stroke="${LN}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    if(kind==='flat') return `<path d="M${cx-6.5} ${cy} L${cx+6.5} ${cy}" stroke="${LN}" stroke-width="2" stroke-linecap="round"/>`;
    if(kind==='xx') return `<path d="M${cx-5} ${cy-4.5} L${cx+5} ${cy+4.5} M${cx+5} ${cy-4.5} L${cx-5} ${cy+4.5}" stroke="${LN}" stroke-width="2.2" stroke-linecap="round"/>`;

    if(who==='shia'){
      const shrink = kind==='shrink', hollow = kind==='hollow';
      const rx = shrink?4:6.4, ry = shrink?5.5:8.4;
      let s=`<path d="M${cx-8.4} ${cy-7.5} Q${cx} ${cy-10.5} ${cx+8.4} ${cy-7.5} L${cx+8.8} ${cy+6} Q${cx} ${cy+9.5} ${cx-8.8} ${cy+6} Z" fill="#fff"/>`;
      s+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${c.iris}" stroke="${c.irisD}" stroke-width="1.4"/>`;
      s+=`<path d="M${cx-rx*0.8} ${cy-ry*0.5} Q${cx} ${cy-ry*0.95} ${cx+rx*0.8} ${cy-ry*0.5} L${cx+rx*0.6} ${cy-ry*0.1} Q${cx} ${cy-ry*0.5} ${cx-rx*0.6} ${cy-ry*0.1} Z" fill="${c.irisD}" opacity=".75"/>`;
      s+=`<ellipse cx="${cx}" cy="${cy+1}" rx="1.8" ry="2.6" fill="#241812"/>`;
      if(!hollow) s+=`<circle cx="${cx-2.4}" cy="${cy-2.6}" r="2.2" fill="#fff"/><circle cx="${cx+2.8}" cy="${cy+3}" r="1.1" fill="#fff" opacity=".95"/>`;
      s+=`<path d="M${cx-9} ${cy-7} Q${cx} ${cy-11.5} ${cx+9} ${cy-7}" fill="none" stroke="${LN}" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M${cx+8.6} ${cy-8} l3 -2.8 M${cx+6.6} ${cy-10} l2.4 -2.8 M${cx+4} ${cy-11.2} l1.6 -2.8" stroke="${LN}" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M${cx-6} ${cy+9.5} Q${cx} ${cy+11.5} ${cx+6} ${cy+9.5}" fill="none" stroke="${LN}" stroke-width="1.1" opacity=".6"/>
          <path d="M${cx+5.5} ${cy+10.5} l1.8 2 M${cx+2} ${cy+11.4} l1.2 2.2" stroke="${LN}" stroke-width="1" stroke-linecap="round" opacity=".7"/>`;
      return s;
    }
    if(who==='oshida'){
      const half=(kind==='half'), shrink=(kind==='shrink');
      let s='';
      const topY = half? cy-1.5 : cy-3.5;
      s+=`<path d="M${cx-9} ${cy+1} Q${cx} ${cy+4.5} ${cx+8} ${cy+2} L${cx+8} ${topY} L${cx-9} ${topY+1} Z" fill="#fff"/>`;
      const ir = shrink?2.6:4;
      s+=`<ellipse cx="${cx}" cy="${cy+1}" rx="${ir}" ry="${ir+1.4}" fill="${c.iris}" stroke="${c.irisD}" stroke-width="1.1"/>
          <ellipse cx="${cx}" cy="${cy+1.5}" rx="1.3" ry="1.8" fill="#1c1512"/>
          <circle cx="${cx-1.4}" cy="${cy-0.4}" r=".9" fill="#fff"/>`;
      s+=`<path d="M${cx-10} ${topY+1.5} Q${cx-1} ${topY-3} ${cx+8} ${topY}" fill="none" stroke="${LN}" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M${cx+8} ${topY} L${cx+13} ${topY-3.5}" stroke="${LN}" stroke-width="2.2" stroke-linecap="round"/>`;
      s+=`<path d="M${cx-6} ${cy+6} Q${cx} ${cy+7.5} ${cx+6} ${cy+6}" fill="none" stroke="${LN}" stroke-width="1" opacity=".5"/>`;
      if(kind==='angry') s+=`<path d="M${cx-sgn*9} ${cy-11} L${cx+sgn*8} ${cy-7}" stroke="${LN}" stroke-width="2" stroke-linecap="round"/>`;
      return s;
    }
    if(who==='shimoda'){
      if(kind==='shrink'||kind==='hollow') return `<circle cx="${cx}" cy="${cy}" r="4.4" fill="#fff" stroke="${LN}" stroke-width="1.6"/><circle cx="${cx}" cy="${cy}" r="1.3" fill="${LN}"/>`;
      if(kind==='angry') return `<circle cx="${cx}" cy="${cy}" r="2.8" fill="${LN}"/><path d="M${cx-sgn*7} ${cy-8} L${cx+sgn*7} ${cy-4.5}" stroke="${LN}" stroke-width="1.9" stroke-linecap="round"/>`;
      if(kind==='half') return `<path d="M${cx-5.5} ${cy-1} Q${cx} ${cy+0.5} ${cx+5.5} ${cy-1}" stroke="${LN}" stroke-width="1.9" fill="none" stroke-linecap="round"/><circle cx="${cx}" cy="${cy+1.5}" r="1.9" fill="${LN}"/>`;
      return `<circle cx="${cx}" cy="${cy}" r="2.7" fill="${LN}"/><circle cx="${cx-0.9}" cy="${cy-1}" r=".8" fill="#fff"/>`;
    }
    if(who==='tanaka'){
      if(kind==='shrink'||kind==='hollow') return `<circle cx="${cx}" cy="${cy}" r="4" fill="#fff" stroke="${LN}" stroke-width="1.6"/><circle cx="${cx}" cy="${cy}" r="1.1" fill="${LN}"/>`;
      if(kind==='half'||kind==='open') return `<path d="M${cx-6} ${cy-2.5} Q${cx} ${cy-0.5} ${cx+6} ${cy-2.5}" stroke="${LN}" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="${cx}" cy="${cy+1}" r="2" fill="${LN}"/>`;
      return `<circle cx="${cx}" cy="${cy}" r="2.2" fill="${LN}"/>`;
    }
    if(kind==='shrink'||kind==='hollow') return `<circle cx="${cx}" cy="${cy}" r="4" fill="#fff" stroke="${LN}" stroke-width="1.6"/><circle cx="${cx}" cy="${cy}" r="1.1" fill="${LN}"/>`;
    if(kind==='angry') return `<circle cx="${cx}" cy="${cy+0.5}" r="2.6" fill="${LN}"/><path d="M${cx-sgn*8} ${cy-9} L${cx+sgn*8} ${cy-5}" stroke="${LN}" stroke-width="2.6" stroke-linecap="round"/>`;
    if(kind==='half') return `<circle cx="${cx}" cy="${cy+1}" r="2.2" fill="${LN}"/><path d="M${cx-6} ${cy-2.5} L${cx+6} ${cy-2.5}" stroke="${LN}" stroke-width="2.2" stroke-linecap="round"/>`;
    return `<circle cx="${cx}" cy="${cy}" r="2.4" fill="${LN}"/>`;
  };
  return one(100-dx,-1)+one(100+dx,1);
}

function mouth(who,kind,y){
  const x=100, s = who==='ueno'?1.25:1;
  const lip = (who==='oshida'||who==='shia');
  switch(kind){
    case 'closed': return `<path d="M${x-4.5*s} ${y} Q${x} ${y+2} ${x+4.5*s} ${y}" stroke="${LN}" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      ${lip?`<path d="M${x-3} ${y+3.5} Q${x} ${y+5} ${x+3} ${y+3.5}" stroke="#cf9086" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".8"/>`:''}`;
    case 'smile': return `<path d="M${x-5.5*s} ${y-1} Q${x} ${y+4.5} ${x+5.5*s} ${y-1}" stroke="${LN}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      ${lip?`<path d="M${x-3} ${y+4} Q${x} ${y+5.5} ${x+3} ${y+4}" stroke="#cf9086" stroke-width="1.3" fill="none" opacity=".8"/>`:''}`;
    case 'smirk': return `<path d="M${x-4.5*s} ${y+1.5} Q${x+2} ${y+4} ${x+6.5*s} ${y-2}" stroke="${LN}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    case 'wavy': return `<path d="M${x-6.5*s} ${y} q2.2 3 4.4 0 t4.4 0 t4.4 0" stroke="${LN}" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
    case 'oo': return `<ellipse cx="${x}" cy="${y+1}" rx="${3*s}" ry="3.8" fill="#c67c72" stroke="${LN}" stroke-width="1.4"/>`;
    case 'open': return `<path d="M${x-6*s} ${y-1} Q${x} ${y+8} ${x+6*s} ${y-1} Q${x} ${y+1.5} ${x-6*s} ${y-1} Z" fill="#c67c72" stroke="${LN}" stroke-width="1.5" stroke-linejoin="round"/>`;
    case 'grin': return `<path d="M${x-8*s} ${y-2} Q${x} ${y+9.5} ${x+8*s} ${y-2} Q${x} ${y+1.5} ${x-8*s} ${y-2} Z" fill="#c67c72" stroke="${LN}" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M${x-6.5*s} ${y-0.8} Q${x} ${y+1.6} ${x+6.5*s} ${y-0.8} L${x+5*s} ${y+1.2} Q${x} ${y+3.4} ${x-5*s} ${y+1.2} Z" fill="#fff"/>`;
    case 'shout': return `<path d="M${x-7*s} ${y-3.5} Q${x} ${y-5.5} ${x+7*s} ${y-3.5} Q${x+8*s} ${y+4.5} ${x} ${y+7} Q${x-8*s} ${y+4.5} ${x-7*s} ${y-3.5} Z" fill="#c67c72" stroke="${LN}" stroke-width="1.6" stroke-linejoin="round"/>`;
    default: return '';
  }
}

function drawChar(who,expr='normal',opt={}){
  const c=CH[who], E=EXPR[expr]||EXPR.normal;
  let p=[];
  const eyeY=72, mouthY=101;

  /* 体 */
  if(who==='oshida'){
    p.push(`<path d="M100 138 C78 141 64 150 58 260 L142 260 C136 150 122 141 100 138 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M92 141 L100 158 L108 141 Z" fill="#ece8e0" stroke="${LN}" stroke-width="1.4"/>
      <path d="M88 140 L100 162 L82 176 M112 140 L100 162 L118 176" stroke="${c.cloth2}" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
      <path d="M70 176 C69 204 68 232 67 260 M130 176 C131 204 132 232 133 260" stroke="${c.cloth2}" stroke-width="1.3" fill="none" opacity=".8"/>`);
  }else if(who==='shimoda'){
    p.push(`<path d="M100 136 C74 139 60 148 54 260 L146 260 C140 148 126 139 100 136 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M82 146 C82 138 118 138 118 146" fill="none" stroke="${c.cloth2}" stroke-width="2.4"/>
      <path d="M93 150 L92 174 M107 150 L108 174" stroke="#fdfcf8" stroke-width="1.8" stroke-linecap="round"/>`);
  }else if(who==='ueno'){
    p.push(`<path d="M100 132 C68 135 52 145 46 260 L154 260 C148 145 132 135 100 132 Z" fill="${c.skin}" stroke="${LN}" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M64 160 L64 260 L136 260 L136 160 C118 170 82 170 64 160 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M82 144 Q100 158 118 144" stroke="#cfa64a" stroke-width="2.6" fill="none"/>
      <circle cx="100" cy="153" r="2.4" fill="#cfa64a"/>`);
  }else if(who==='tanaka'){
    p.push(`<path d="M100 136 C76 139 62 148 56 260 L144 260 C138 148 124 139 100 136 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M91 139 L100 154 L109 139 L114 145 L102 166 L100 170 L98 166 L86 145 Z" fill="#f4f2ea" stroke="${LN}" stroke-width="1.3"/>
      <path d="M100 154 l-4 5 4 22 4 -22 z" fill="#8a4a4a" stroke="${LN}" stroke-width="1.2"/>
      <path d="M74 160 C72 192 71 226 70 260 M126 160 C128 192 129 226 130 260" stroke="${c.cloth2}" stroke-width="1.4" fill="none" opacity=".9"/>`);
  }else if(who==='ooya'){
    p.push(`<path d="M100 138 C74 141 60 150 56 260 L144 260 C140 150 126 141 100 138 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M84 142 C88 152 112 152 116 142" fill="none" stroke="#e8ddcc" stroke-width="3" stroke-linecap="round"/>
      <path d="M64 190 Q100 200 136 190" stroke="${c.cloth2}" stroke-width="2.2" fill="none"/>
      <circle cx="100" cy="160" r="2" fill="${c.cloth2}"/><circle cx="100" cy="174" r="2" fill="${c.cloth2}"/>`);
  }else{
    p.push(`<path d="M100 138 C80 141 68 150 62 260 L138 260 C132 150 120 141 100 138 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M90 141 C93 149 107 149 110 141" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M100 150 l-5 4 5 4 5 -4 z" fill="${c.cloth2}" stroke="${LN}" stroke-width="1.2"/>
      <path d="M74 168 C73 198 72 228 71 260 M126 168 C127 198 128 228 129 260" stroke="${c.cloth2}" stroke-width="1.2" fill="none" opacity=".8"/>`);
  }

  /* しあの後ろ髪 */
  if(who==='shia'){
    p.push(`<path d="M64 60 C60 32 78 18 100 18 C122 18 140 32 136 60 C139 84 137 104 131 118 L127 92 L73 92 L69 118 C63 104 61 84 64 60 Z" fill="${c.hair}" stroke="${LN}" stroke-width="1.6"/>
      <path d="M134 66 C152 76 158 110 150 142 C146 160 136 172 129 177 C136 150 136 118 128 96 C125 85 126 72 129 67 Z" fill="${c.hair}" stroke="${LN}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M136 92 C144 116 144 144 137 166 M142 88 C150 112 150 138 145 158" stroke="${c.hairHi}" stroke-width="1.1" fill="none" opacity=".85"/>
      <circle cx="132" cy="71" r="5" fill="#e0a8b8" stroke="${LN}" stroke-width="1.2"/>`);
  }

  /* 首 */
  const nw = who==='ueno'?12:8;
  p.push(`<path d="M${100-nw} 108 L${100-nw} 140 L${100+nw} 140 L${100+nw} 108 Z" fill="${c.skin}"/>
    <path d="M${100-nw} 110 C${100-nw*0.3} 120 ${100+nw*0.3} 120 ${100+nw} 110" fill="none" stroke="#dbb89e" stroke-width="1.4" opacity=".8"/>
    <path d="M${100-nw} 108 L${100-nw} 139 M${100+nw} 108 L${100+nw} 139" stroke="${LN}" stroke-width="1.2"/>`);
  if(who==='oshida') p.push(`<path d="M92 124 H108" stroke="${LN}" stroke-width="3"/><circle cx="100" cy="128" r="1.6" fill="#cfa64a"/>`);
  if(who==='shia') p.push(`<path d="M93 128 Q100 132 107 128" stroke="#e0a8b8" stroke-width="2" fill="none"/>`);

  /* 顔 */
  const FACE={
    oshida:'M100 22 C121 22 134 37 133 58 C132 76 126 90 116 100 C110 106 104 110 100 110 C96 110 90 106 84 100 C74 90 68 76 67 58 C66 37 79 22 100 22 Z',
    shimoda:'M100 24 C123 24 136 40 135 60 C134 80 127 94 114 102 C106 106 94 106 86 102 C73 94 66 80 65 60 C64 40 77 24 100 24 Z',
    ueno:'M100 22 C126 24 139 40 138 62 C137 84 129 98 116 104 C106 108 94 108 84 104 C71 98 63 84 62 62 C61 40 74 24 100 22 Z',
    shia:'M100 26 C121 26 133 41 132 60 C131 77 125 90 114 98 C108 103 103 105 100 105 C97 105 92 103 86 98 C75 90 69 77 68 60 C67 41 79 26 100 26 Z',
    tanaka:'M100 24 C123 24 136 40 135 60 C134 80 127 94 114 102 C106 106 94 106 86 102 C73 94 66 80 65 60 C64 40 77 24 100 24 Z',
    ooya:'M100 26 C122 26 134 42 133 60 C132 79 126 92 114 100 C106 104 94 104 86 100 C74 92 68 79 67 60 C66 42 78 26 100 26 Z'
  };
  p.push(`<path d="${FACE[who]}" fill="${c.skin}" stroke="${LN}" stroke-width="1.8"/>`);

  if(who!=='shia'){
    p.push(`<path d="M67 62 C60 60 59 68 63 73 C66 77 69 76 70 72" fill="${c.skin}" stroke="${LN}" stroke-width="1.2"/>
      <path d="M133 62 C140 60 141 68 137 73 C134 77 131 76 130 72" fill="${c.skin}" stroke="${LN}" stroke-width="1.2"/>`);
  }

  p.push(eyes(who,E.e,eyeY));
  if(who==='ueno') p.push(`<path d="M95 78 C92 88 92 92 95 94 Q100 98 105 94 C108 92 108 88 105 78" fill="${c.skin}" stroke="${LN}" stroke-width="1.4"/>`);

function focusLines(color,cx,cy,n,inner){
  let s='';
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, j=sr(i)*0.035, ir=inner+sr(i+99)*46;
    const x1=cx+Math.cos(a)*ir, y1=cy+Math.sin(a)*ir;
    const x2=cx+Math.cos(a-0.02-j)*560, y2=cy+Math.sin(a-0.02-j)*560;
    const x3=cx+Math.cos(a+0.02+j)*560, y3=cy+Math.sin(a+0.02+j)*560;
    s+=`<polygon points="${x1},${y1} ${x2},${y2} ${x3},${y3}" fill="${color}"/>`;
  }
  return s;
}
function flower(x,y,r,col){
  let s='';
  for(let k=0;k<5;k++){const a=k/5*Math.PI*2-Math.PI/2;
    s+=`<ellipse cx="${x+Math.cos(a)*r*0.62}" cy="${y+Math.sin(a)*r*0.62}" rx="${r*0.46}" ry="${r*0.6}" fill="${col}" transform="rotate(${a*180/Math.PI+90} ${x+Math.cos(a)*r*0.62} ${y+Math.sin(a)*r*0.62})"/>`;}
  s+=`<circle cx="${x}" cy="${y}" r="${r*0.3}" fill="#e8c86a"/>`;
  return s;
}

function panel(p){
  let inner=`<div class="stage">`;
  if(p.scene && SCENES[p.scene]) inner+=SCENES[p.scene]();
  (p.ch||[]).forEach(c=>{
    const w=(c.w||46)*0.8;
    inner+=`<div class="ch" style="left:${c.x}%;bottom:${c.b??0}%;width:${w}%;">${drawChar(c.who,c.e,{flip:c.flip})}</div>`;
    if(c.tag) inner+=`<div class="name" style="left:${c.x+2}%;bottom:${(c.b??0)+2}%">${c.tag}</div>`;
  });
  if(p.fg && FG[p.fg]) inner+=FG[p.fg]();
  (p.sfx||[]).forEach(s=>{
    inner+=`<div class="sfx" style="left:${s.x}%;top:${s.y}%;font-size:${s.s||24}px;${s.r?`transform:rotate(${s.r}deg)`:''}">${s.t}</div>`;
  });
  (p.naru||[]).forEach(n=>{ inner+=`<div class="naru" style="${n.pos||'top:4%;left:4%'}">${n.t}</div>`; });
  (p.bub||[]).forEach(b=>{
    const cls=b.k==='think'?'bub think':b.k==='shout'?'bub shout':'bub';
    inner+=`<div class="${cls}" style="${b.pos}">${b.t}</div>`;
  });
  inner+=`</div>`;
  return `<div class="panel" style="flex-grow:${p.f||1};min-height:${(p.h||160)+30}px">${inner}</div>`;
}
function page(pg){
  const rows=pg.rows.map(r=>`<div class="row">${r.map(panel).join('')}</div>`).join('');
  return `<div class="page">${rows}<div class="pagenum">— ${pg.n} —</div></div>`;
}

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一日ずつ ―湊の四十年―（まるやわ版）</title>
<style>
  :root{ --ink:#4a4038; --paper:#faf5ea; --panel:#fffdf6; }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:#d9e4e0; color:#4a4038;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Zen Maru Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .book{ max-width:820px; margin:0 auto; padding:24px 14px 80px; }
  .cover{
    background:var(--panel); border:2.5px solid var(--ink); border-radius:14px;
    padding:36px 24px 28px; text-align:center; margin-bottom:28px;
    box-shadow:0 8px 20px rgba(74,64,56,.25);
  }
  .cover h1{ font-size:31px; margin:0 0 8px; letter-spacing:.12em; font-weight:800; color:#3e6b8a; }
  .cover .ep{ font-size:15px; font-weight:700; margin:6px 0 2px; color:#8a7a66; }
  .cover .sub{ font-size:12px; color:#a3947e; letter-spacing:.1em; line-height:1.8; }
  .cast{ display:flex; justify-content:center; align-items:flex-end; gap:6px; margin:18px 0 8px; }
  .cast div{ width:118px; }
  .cast svg{ width:100%; display:block; }
  .castname{ font-size:11px; font-weight:800; color:#8a7a66; }
  .page{
    background:var(--paper); border:2.5px solid var(--ink); border-radius:14px;
    padding:12px; margin:0 auto 26px; box-shadow:0 8px 20px rgba(74,64,56,.25);
    position:relative;
  }
  .pagenum{ position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    font-size:12px; color:#bcab92; font-weight:700; }
  .row{ display:flex; flex-direction:row-reverse; gap:10px; margin-bottom:10px; }
  .row:last-child{ margin-bottom:14px; }
  .panel{
    position:relative; background:var(--panel); border:2.2px solid var(--ink);
    border-radius:10px; overflow:hidden; flex:1 1 0;
  }
  .stage{ position:absolute; inset:0; }
  .scene{ position:absolute; inset:0; width:100%; height:100%; }
  .ch{ position:absolute; z-index:2; }
  .ch svg{ display:block; width:100%; height:auto; overflow:visible; }
  .bub{
    position:absolute; background:#fff; border:2px solid var(--ink);
    border-radius:18px; padding:7px 11px; text-align:center;
    font-weight:700; line-height:1.4; font-size:13px;
    z-index:5; white-space:nowrap; color:#4a4038;
  }
  .bub small{ font-size:11px; }
  .bub.think{ border-style:dotted; border-width:2.4px; border-radius:24px; background:#fffdf2; }
  .naru{
    position:absolute; background:#fffdf2; border:2px solid var(--ink);
    border-radius:6px; padding:7px 11px; font-size:12.5px; font-weight:700;
    white-space:nowrap; line-height:1.55; z-index:5; color:#4a4038;
  }
  .naru.dark{ background:#54636b; color:#fdfaf0; border-color:#3a464c; }
  .sfx{
    position:absolute; font-weight:900; color:#8a9aa4;
    font-size:22px; letter-spacing:.02em;
    transform:rotate(-6deg); pointer-events:none; z-index:4;
  }
  .name{ position:absolute; font-size:10px; font-weight:800; color:#8a7a66;
    background:rgba(255,255,255,.92); padding:1px 6px; border-radius:8px; z-index:5;
    border:1.5px solid rgba(74,64,56,.35); }
  .endcard{ text-align:center; color:#7a8a94; padding:10px 0 0; font-weight:800; letter-spacing:.2em; }
  .ephead{ background:#3e6b8a; color:#fdfaf0; border:2.5px solid var(--ink); border-radius:12px;
    padding:10px 16px; margin:6px auto 16px; font-weight:800; letter-spacing:.1em; text-align:center;
    font-size:15px; box-shadow:0 4px 10px rgba(74,64,56,.25); }
  .ephead small{ display:block; font-size:11px; color:#c8dae4; letter-spacing:.18em; margin-bottom:2px; }
  .note{ background:var(--panel); border:2px dashed var(--ink); border-radius:12px;
    padding:16px 18px; font-size:12.5px; line-height:1.85; }
  .note h3{ margin:0 0 8px; font-size:14px; }
</style>
</head>
<body>
<div class="book" id="book"></div>

<script>
/* ========= 作画エンジン：まるやわ・ガチムチスタイル ========= */
let uid=0;
const LN='#4a4038';
const sr=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};

/* body: stocky / chubby / slim / apron / coat / cardigan */
const CH={
  boy: { skin:'#fbe3cc', shade:'#eec6a4', hair:'#3c342c', cloth:'#a8c8dc', cloth2:'#8fb2c8',
         body:'stocky', stubble:0 },
  man: { skin:'#f8ddc2', shade:'#e5bd98', hair:'#332c24', cloth:'#f6f3ea', cloth2:'#dcd7c8',
         body:'stocky', stubble:1 },
  old: { skin:'#f6dcc4', shade:'#e2ba96', hair:'#4c443a', cloth:'#7a8a94', cloth2:'#68787f',
         body:'stocky', stubble:1, tired:1 },
  kazu:{ skin:'#f8dfc6', shade:'#e5bd98', hair:'#5a4a38', cloth:'#f2ece0', cloth2:'#dcd4c4',
         body:'chubby', stubble:1, stripes:'#c8756a' },
  doc: { skin:'#f8e2cc', shade:'#e5c4a2', hair:'#443c34', cloth:'#f4f2ea', cloth2:'#dad6ca',
         body:'coat', stubble:1 },
  kid: { skin:'#fbe3cc', shade:'#eec6a4', hair:'#3c342c', cloth:'#9ab48e', cloth2:'#86a07a',
         body:'chubby', stubble:0, cap:'#5a7a94' },
  mom: { skin:'#fae6d4', shade:'#e8c8ac', hair:'#b2a89c', cloth:'#c89494', cloth2:'#b48080',
         body:'apron', stubble:0 },
  dad: { skin:'#f6dfc8', shade:'#e2bfa0', hair:'#9a948a', cloth:'#8a847a', cloth2:'#787268',
         body:'cardigan', stubble:0, bald:1 }
};

const EXPR={
  normal:{e:'open',m:'closed'},
  deadpan:{e:'half',m:'closed'},
  soft:{e:'closedHappy',m:'smile'},
  happy:{e:'closedHappy',m:'open'},
  grin:{e:'open',m:'grin'},
  dead:{e:'flat',m:'wavy'},
  hollow:{e:'hollow',m:'closed'},
  cry:{e:'closedSad',m:'wavy',tear:1},
  crysoft:{e:'closedHappy',m:'smile',tear:1},
  shock:{e:'shrink',m:'oo',sweat:1},
  sad:{e:'half',m:'frown'},
  x:{e:'xx',m:'wavy'}
};

function eyes(who,kind,cy){
  const dx=16;
  const one=(cx)=>{
    switch(kind){
      case 'open': return `<circle cx="${cx}" cy="${cy}" r="3.2" fill="${LN}"/><circle cx="${cx-1}" cy="${cy-1.1}" r=".9" fill="#fff"/>`;
      case 'half': return `<path d="M${cx-5.5} ${cy-2} Q${cx} ${cy-0.5} ${cx+5.5} ${cy-2}" stroke="${LN}" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="${cx}" cy="${cy+1.5}" r="2.2" fill="${LN}"/>`;
      case 'closedHappy': return `<path d="M${cx-6} ${cy+1.5} Q${cx} ${cy-4.5} ${cx+6} ${cy+1.5}" stroke="${LN}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
      case 'closedSad': return `<path d="M${cx-6} ${cy-1} Q${cx} ${cy+4.5} ${cx+6} ${cy-1}" stroke="${LN}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
      case 'flat': return `<path d="M${cx-5.5} ${cy} L${cx+5.5} ${cy}" stroke="${LN}" stroke-width="2.6" stroke-linecap="round"/>`;
      case 'hollow': return `<circle cx="${cx}" cy="${cy}" r="2.6" fill="${LN}" opacity=".85"/>`;
      case 'shrink': return `<circle cx="${cx}" cy="${cy}" r="5" fill="#fff" stroke="${LN}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="1.3" fill="${LN}"/>`;
      case 'xx': return `<path d="M${cx-4.5} ${cy-4} L${cx+4.5} ${cy+4} M${cx+4.5} ${cy-4} L${cx-4.5} ${cy+4}" stroke="${LN}" stroke-width="2.6" stroke-linecap="round"/>`;
      default: return '';
    }
  };
  return one(100-dx)+one(100+dx);
}
function mouth(kind,y){
  const x=100;
  switch(kind){
    case 'closed': return `<path d="M${x-3.5} ${y} Q${x} ${y+2} ${x+3.5} ${y}" stroke="${LN}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    case 'smile': return `<path d="M${x-5.5} ${y-1} Q${x} ${y+4.5} ${x+5.5} ${y-1}" stroke="${LN}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    case 'frown': return `<path d="M${x-5} ${y+2} Q${x} ${y-2.5} ${x+5} ${y+2}" stroke="${LN}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    case 'wavy': return `<path d="M${x-6} ${y} q2 2.8 4 0 t4 0 t4 0" stroke="${LN}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    case 'oo': return `<ellipse cx="${x}" cy="${y+1}" rx="3.2" ry="4" fill="#c9705e" stroke="${LN}" stroke-width="1.8"/>`;
    case 'open': return `<path d="M${x-6} ${y-1} Q${x} ${y+8} ${x+6} ${y-1} Q${x} ${y+1.5} ${x-6} ${y-1} Z" fill="#c9705e" stroke="${LN}" stroke-width="1.9" stroke-linejoin="round"/>`;
    case 'grin': return `<path d="M${x-8} ${y-2} Q${x} ${y+9.5} ${x+8} ${y-2} Q${x} ${y+1.5} ${x-8} ${y-2} Z" fill="#c9705e" stroke="${LN}" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M${x-6.5} ${y-0.8} Q${x} ${y+1.6} ${x+6.5} ${y-0.8} L${x+5} ${y+1.2} Q${x} ${y+3.4} ${x-5} ${y+1.2} Z" fill="#fff"/>`;
    default: return '';
  }
}

function drawChar(who,expr='normal',opt={}){
  const c=CH[who], E=EXPR[expr]||EXPR.normal;
  let p=[];
  const eyeY=78, mouthY=100;
  const id='t'+(uid++);

  /* ---- 体 ---- */
  if(c.body==='stocky'){
    p.push(`<defs><clipPath id="${id}"><path d="M100 116 C62 120 42 132 38 240 L162 240 C158 132 138 120 100 116 Z"/></clipPath></defs>
      <path d="M100 116 C62 120 42 132 38 240 L162 240 C158 132 138 120 100 116 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M84 118 C88 128 112 128 116 118" fill="none" stroke="${c.cloth2}" stroke-width="2.6"/>
      <path d="M56 140 C50 148 46 158 44 170 M144 140 C150 148 154 158 156 170" stroke="${c.cloth2}" stroke-width="2" fill="none"/>
      <path d="M70 168 q30 15 60 0" stroke="${c.cloth2}" stroke-width="1.8" fill="none" opacity=".75"/>`);
  }else if(c.body==='chubby'){
    p.push(`<defs><clipPath id="${id}"><path d="M100 116 C58 120 34 134 28 240 L172 240 C166 134 142 120 100 116 Z"/></clipPath></defs>
      <path d="M100 116 C58 120 34 134 28 240 L172 240 C166 134 142 120 100 116 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M84 118 C88 128 112 128 116 118" fill="none" stroke="${c.cloth2}" stroke-width="2.6"/>
      <path d="M44 208 q56 18 112 0" stroke="${c.cloth2}" stroke-width="1.8" fill="none" opacity=".6"/>`);
    if(c.stripes){
      let st='';
      for(let k=0;k<4;k++) st+=`<path d="M20 ${146+k*26} q80 12 160 0" stroke="${c.stripes}" stroke-width="9" fill="none"/>`;
      p.push(`<g clip-path="url(#${id})" opacity=".9">${st}</g>`);
    }
  }else if(c.body==='coat'){
    p.push(`<path d="M100 116 C60 120 40 132 36 240 L164 240 C160 132 140 120 100 116 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M90 118 L100 136 L110 118 L115 124 L103 148 L100 152 L97 148 L85 124 Z" fill="#c2d2da" stroke="${LN}" stroke-width="1.6"/>
      <path d="M100 136 L100 240 M62 150 C60 180 59 210 58 240 M138 150 C140 180 141 210 142 240" stroke="${c.cloth2}" stroke-width="1.8" fill="none"/>`);
  }else if(c.body==='apron'){
    p.push(`<path d="M100 118 C66 122 48 134 44 240 L156 240 C152 134 134 122 100 118 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M76 156 C76 142 124 142 124 156 L124 226 C108 234 92 234 76 226 Z" fill="#f4ecdc" stroke="${LN}" stroke-width="1.8"/>
      <path d="M84 120 C88 130 112 130 116 120" fill="none" stroke="#f4ecdc" stroke-width="2.6"/>`);
  }else{ /* cardigan */
    p.push(`<path d="M100 118 C64 122 46 134 42 240 L158 240 C154 134 136 122 100 118 Z" fill="${c.cloth}" stroke="${LN}" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M91 120 L100 134 L109 120 Z" fill="#f0e8d8" stroke="${LN}" stroke-width="1.4"/>
      <path d="M100 134 L100 240" stroke="${c.cloth2}" stroke-width="1.8"/>
      <circle cx="94" cy="152" r="1.8" fill="${c.cloth2}"/><circle cx="94" cy="172" r="1.8" fill="${c.cloth2}"/>`);
  }

  /* ---- 首（短く太く） ---- */
  p.push(`<path d="M82 96 L82 124 L118 124 L118 96 Z" fill="${c.skin}"/>
    <path d="M82 100 C90 110 110 110 118 100" fill="none" stroke="${c.shade}" stroke-width="1.8" opacity=".8"/>
    <path d="M82 96 L82 122 M118 96 L118 122" stroke="${LN}" stroke-width="1.6"/>`);

  /* ---- ママのパーマ（顔の奥） ---- */
  if(who==='mom'){
    let curls='';
    const pos=[[64,74],[66,56],[76,42],[90,34],[106,34],[120,42],[130,56],[132,74]];
    pos.forEach(q=>{curls+=`<circle cx="${q[0]}" cy="${q[1]}" r="13" fill="${c.hair}" stroke="${LN}" stroke-width="1.8"/>`;});
    curls+=`<ellipse cx="98" cy="56" rx="36" ry="28" fill="${c.hair}"/>`;
    p.push(curls);
  }

  /* ---- 顔（まん丸・ほっぺふっくら） ---- */
  p.push(`<path d="M100 28 C127 28 143 46 144 68 C145 90 136 108 121 114 C113 118 87 118 79 114 C64 108 55 90 56 68 C57 46 73 28 100 28 Z"
    fill="${c.skin}" stroke="${LN}" stroke-width="2.2"/>`);
  /* 耳 */
  p.push(`<path d="M57 74 C49 72 48 81 53 87 C56 91 60 90 61 85" fill="${c.skin}" stroke="${LN}" stroke-width="1.6"/>
    <path d="M143 74 C151 72 152 81 147 87 C144 91 140 90 139 85" fill="${c.skin}" stroke="${LN}" stroke-width="1.6"/>`);

  /* ---- 髪 ---- */
  if(who==='dad'){
    p.push(`<path d="M60 64 C60 48 66 39 74 35 C71 47 71 57 73 64 Z" fill="${c.hair}" stroke="${LN}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M140 64 C140 48 134 39 126 35 C129 47 129 57 127 64 Z" fill="${c.hair}" stroke="${LN}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M84 30 q16 -7 32 0" stroke="${c.hair}" stroke-width="2" fill="none" opacity=".85"/>`);
  }else if(who==='mom'){
    p.push(`<path d="M70 46 q9 -8 18 -2 M88 40 q9 -8 18 -2 M106 40 q9 -6 16 1 M120 46 q8 -4 12 4" stroke="${LN}" stroke-width="1.6" fill="none" opacity=".7"/>`);
  }else if(who==='kid'){
    p.push(`<path d="M58 60 C58 36 76 22 100 22 C124 22 142 36 142 60 L58 60 Z" fill="${c.cap}" stroke="${LN}" stroke-width="2"/>
      <path d="M52 60 L148 60 C150 66 146 70 140 70 L58 68 C53 68 50 64 52 60 Z" fill="${c.cap}" stroke="${LN}" stroke-width="1.8"/>
      <circle cx="100" cy="38" r="3" fill="${c.cloth2}" stroke="${LN}" stroke-width="1.2"/>
      <path d="M62 72 C64 66 68 63 72 62 M138 72 C136 66 132 63 128 62" stroke="${c.hair}" stroke-width="4" fill="none" stroke-linecap="round"/>`);
  }else{
    /* 短髪クロップ＋直線前髪 */
    p.push(`<path d="M56 66 C56 38 74 24 100 24 C126 24 144 38 144 66 C144 58 140 50 133 48 L128 52 L122 47 L114 51 L107 46 L100 50 L93 46 L86 51 L78 47 L72 52 L67 48 C60 50 56 58 56 66 Z"
      fill="${c.hair}" stroke="${LN}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M56 64 C55 72 56 78 59 84 C61 76 61 70 62 65 Z" fill="${c.hair}" stroke="${LN}" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M144 64 C145 72 144 78 141 84 C139 76 139 70 138 65 Z" fill="${c.hair}" stroke="${LN}" stroke-width="1.5" stroke-linejoin="round"/>`);
  }

  /* ---- 眉（短く太く） ---- */
  const bY = eyeY-11;
  p.push(`<path d="M${84-6} ${bY+1} q6 -3 12 0" stroke="${LN}" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M${116-6} ${bY+1} q6 -3 12 0" stroke="${LN}" stroke-width="4" fill="none" stroke-linecap="round"/>`);

  /* ---- 目・鼻・口 ---- */
  p.push(eyes(who,E.e,eyeY));
  if(c.tired) p.push(`<path d="M${84-5} ${eyeY+7} q5 3 10 0 M${116-5} ${eyeY+7} q5 3 10 0" stroke="${c.shade}" stroke-width="1.6" fill="none"/>`);
  p.push(`<path d="M100 87 q2 2.6 0 4.6" stroke="${LN}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`);
  p.push(mouth(E.m,mouthY));

  /* ---- ほっぺ（赤み） ---- */
  p.push(`<ellipse cx="71" cy="94" rx="8.5" ry="4.5" fill="#f5b493" opacity=".55"/>
    <ellipse cx="129" cy="94" rx="8.5" ry="4.5" fill="#f5b493" opacity=".55"/>`);

  /* ---- 無精ひげ ---- */
  if(c.stubble){
    let st='';
    for(let i=0;i<16;i++){const a=Math.PI*(0.18+0.64*sr(i+5));const r=24+sr(i+40)*7;
      st+=`<circle cx="${100+Math.cos(a)*r}" cy="${100+Math.sin(a)*r*0.55}" r="1" fill="${LN}" opacity=".5"/>`;}
    p.push(st);
  }
  if(who==='dad') p.push(`<path d="M92 95 Q100 98 108 95" stroke="#8a847a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g fill="none" stroke="${LN}" stroke-width="1.8"><circle cx="84" cy="${eyeY}" r="9.5"/><circle cx="116" cy="${eyeY}" r="9.5"/><path d="M93.5 ${eyeY} L106.5 ${eyeY} M74.5 ${eyeY-2} L66 ${eyeY-4} M125.5 ${eyeY-2} L134 ${eyeY-4}"/></g>`);
  if(who==='doc') p.push(`<g fill="none" stroke="${LN}" stroke-width="1.8"><rect x="75" y="${eyeY-7}" width="18" height="13" rx="3"/><rect x="107" y="${eyeY-7}" width="18" height="13" rx="3"/><path d="M93 ${eyeY-1} L107 ${eyeY-1} M75 ${eyeY-3} L66 ${eyeY-5} M125 ${eyeY-3} L134 ${eyeY-5}"/></g>`);
  if(who==='mom') p.push(`<path d="M80 88 q4 3 8 2 M112 90 q4 1 8 -1" stroke="${c.shade}" stroke-width="1.4" fill="none"/>`);

  /* ---- 表情エフェクト ---- */
  if(E.tear) p.push(`<path d="M78 88 q-3 7 0 11 q4 -4 0 -11 M122 88 q3 7 0 11 q-4 -4 0 -11" fill="#aed8ec" stroke="#7cb4d2" stroke-width="1.2"/>`);
  if(E.sweat) p.push(`<path d="M144 52 q5 7 0 10.5 q-5.5 -3.5 0 -10.5" fill="#cfe8f4" stroke="#8cc2da" stroke-width="1.3"/>`);

  return `<svg viewBox="0 0 200 240" ${opt.flip?'style="transform:scaleX(-1)"':''}>${p.join('')}</svg>`;
}

/* ========= 背景（明るくやわらかい色） ========= */
function focusLines(color,cx,cy,n,inner){
  let s='';
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, j=sr(i)*0.035, ir=inner+sr(i+99)*46;
    const x1=cx+Math.cos(a)*ir, y1=cy+Math.sin(a)*ir;
    const x2=cx+Math.cos(a-0.02-j)*560, y2=cy+Math.sin(a-0.02-j)*560;
    const x3=cx+Math.cos(a+0.02+j)*560, y3=cy+Math.sin(a+0.02+j)*560;
    s+=`<polygon points="${x1},${y1} ${x2},${y2} ${x3},${y3}" fill="${color}"/>`;
  }
  return s;
}
function svgScene(inner){ return `<svg class="scene" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice">${inner}</svg>`; }

const SCENES={
  flat(){ return svgScene(`<rect width="400" height="260" fill="#fdf9ef"/>
    <ellipse cx="38" cy="32" rx="34" ry="24" fill="#f3ecda" opacity=".8"/>
    <ellipse cx="366" cy="232" rx="38" ry="26" fill="#f3ecda" opacity=".8"/>`);},
  gray(){ return svgScene(`<rect width="400" height="260" fill="#dcdcd4"/>
    <path d="M40 0 V260 M120 0 V260 M200 0 V260 M280 0 V260 M360 0 V260" stroke="#ccccc2" stroke-width="8"/>`);},
  focusDark(){ return svgScene(`<rect width="400" height="260" fill="#7a8a94"/>${focusLines('#f4efe0',200,120,26,100)}`);},
  soft(){ let sp='';
    for(let i=0;i<10;i++){const x=25+sr(i+3)*350,y=18+sr(i+30)*150,r=3+sr(i+60)*4;
      sp+=`<path d="M${x} ${y-r} L${x+r*0.35} ${y-r*0.35} L${x+r} ${y} L${x+r*0.35} ${y+r*0.35} L${x} ${y+r} L${x-r*0.35} ${y+r*0.35} L${x-r} ${y} L${x-r*0.35} ${y-r*0.35} Z" fill="#f2cf7a" opacity=".8"/>`;}
    return svgScene(`<rect width="400" height="260" fill="#fdf4de"/>
      <circle cx="200" cy="110" r="95" fill="#fbeccb" opacity=".9"/>${sp}`);},
  night(){
    let b='';
    const hs=[105,66,135,86,115,76];
    for(let k=0;k<6;k++){
      const bx=k*70-10,bw=64,bh=hs[k],by=260-bh-40;
      b+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh+40}" rx="3" fill="#41506b"/>`;
      for(let wy=0;wy<4;wy++)for(let wx=0;wx<3;wx++){

/* ========= レンダラ ========= */
function panel(p){
  let inner=`<div class="stage">`;
  if(p.scene && SCENES[p.scene]) inner+=SCENES[p.scene]();
  (p.ch||[]).forEach(c=>{
    const w=(c.w||46)*0.85;
    inner+=`<div class="ch" style="left:${c.x}%;bottom:${c.b??0}%;width:${w}%;">${drawChar(c.who,c.e,{flip:c.flip})}</div>`;
    if(c.tag) inner+=`<div class="name" style="left:${c.x+2}%;bottom:${(c.b??0)+2}%">${c.tag}</div>`;
  });
  (p.sfx||[]).forEach(s=>{
    inner+=`<div class="sfx" style="left:${s.x}%;top:${s.y}%;font-size:${s.s||22}px;${s.r?`transform:rotate(${s.r}deg)`:''}">${s.t}</div>`;
  });
  (p.naru||[]).forEach(n=>{ inner+=`<div class="naru ${n.d?'dark':''}" style="${n.pos||'top:4%;left:4%'}">${n.t}</div>`; });
  (p.bub||[]).forEach(b=>{
    const cls=b.k==='think'?'bub think':'bub';
    inner+=`<div class="${cls}" style="${b.pos}">${b.t}</div>`;
  });
  inner+=`</div>`;
  return `<div class="panel" style="flex-grow:${p.f||1};min-height:${(p.h||160)+30}px">${inner}</div>`;
}
function page(pg){
  const rows=pg.rows.map(r=>`<div class="row">${r.map(panel).join('')}</div>`).join('');
  return `<div class="page">${rows}<div class="pagenum">— ${pg.n} —</div></div>`;
}
